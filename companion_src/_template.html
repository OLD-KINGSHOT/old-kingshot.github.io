%/100)), lalu Double Time memotong 20% (×0.8) — bukan stack flat. Double Time TIDAK termasuk dalam stat Construction Speed di Power Panel, jadi dihitung terpisah.":"Formula: Construction Speed divides the base (÷ (1 + %/100)), then Double Time cuts 20% (×0.8) — not a flat stack. Double Time is NOT part of the Power Panel Construction Speed stat, so it is applied separately.","Bangunan":"Building","Bahan":"Resources","Artisan's Vision masuk toko Alliance Championship; Viking Vengeance buka stage Lv12-20":"Artisan's Vision enters the Alliance Championship store; Viking Vengeance unlocks stages Lv12-20","Gen 2 Heroes masuk Hero Recruitment":"Gen 2 Heroes enter Hero Recruitment","Gen 2 Heroes mulai muncul di Hero Recruitment & Intel Missions":"Gen 2 Heroes start appearing in Hero Recruitment & Intel Missions","Tempered Truegold jadi bottleneck baru di atas TG5":"Tempered Truegold becomes the new bottleneck above TG5","@title:satu sumber (kingshotguide), belum disilang-cek":"@title:single source (kingshotguide), not cross-checked","Zoe, Hilde, Marlin (±40-50). Zoe = prioritas F2P!":"Zoe, Hilde, Marlin (±40-50). Zoe = F2P priority!","King’s Castle Battle pertama":"First King’s Castle Battle","Tabel Biaya":"Cost Table","Referensi biaya & durasi upgrade tiap level. Pilih bangunan; centang Truegold untuk melihat langkah pasca-Lv30.":"Reference of upgrade cost & duration per level. Pick a building; tick Truegold to see the post-Lv30 steps.","Tampilkan jalur Truegold (pasca-Lv30 → TG8)":"Show Truegold path (post-Lv30 → TG8)","Bangunan ini mentok Lv30 (tidak punya jalur Truegold).":"This building caps at Lv30 (no Truegold path).","Tidak ada data biaya untuk bangunan ini.":"No cost data for this building.","Jalur Truegold baru relevan jauh di depan — Age of Truegold ~hari 70, TG5 ~hari 150, TG8 ~hari 310 umur server. TG = Truegold, TmpTG = Tempered Truegold.":"The Truegold path only matters far ahead — Age of Truegold ~day 70, TG5 ~day 150, TG8 ~day 310 server age. TG = Truegold, TmpTG = Tempered Truegold.","Tanpa data biaya per-langkah Truegold (kebutuhan total ada, per-level tidak ada di sumber mana pun):":"No per-step Truegold cost data (total requirement exists, per-level does not in any source):","Target di jalur Truegold (pasca-Lv30). Baru relevan jauh di depan — Age of Truegold ~hari 70, TG5 ~hari 150, TG8 ~hari 310 umur server. Prasyarat bangunan diasumsikan sudah Lv30.":"Target is on the Truegold path (post-Lv30). Only matters far ahead — Age of Truegold ~day 70, TG5 ~day 150, TG8 ~day 310 server age. Building prerequisites assumed already Lv30.","Eligible ~hari 70 (umur kingdom), lalu siklus ~4 minggu (matchmaking Sabtu)":"Eligible ~day 70 (kingdom age), then ~4-week cycle (matchmaking Saturdays)","Perang ANTAR-kingdom (bukan internal). 4 fase: Matchmaking (2h) → Preparation (5h, adu poin) → Battle (serang King’s Castle kingdom LAWAN, 19:00 WIB) → Field Triage. ⚠ TIDAK dijamin: kalau matchmaking tak dapat lawan sepadan, KvK batal bulan itu → dapat \"Matchmaking Bye Rewards\" (100 Kingdom Coin dll). Menang Preparation = castle-mu aman & kamu yang menyerang. Combat = RPS (counter unit); jatuhkan rally lawan cepat. ⚡ BEDA dari King’s Castle Battle INTERNAL (~hari 54, biweekly) yang menunjuk King kingdom-mu SENDIRI — lihat tab Castle.":"Cross-kingdom war (not internal). 4 phases: Matchmaking (2d) → Preparation (5d, point race) → Battle (attack the ENEMY kingdom’s King’s Castle, 19:00 WIB) → Field Triage. ⚠ NOT guaranteed: if matchmaking finds no fair opponent, KvK is skipped that month → you get \"Matchmaking Bye Rewards\" (100 Kingdom Coin etc.). Win Preparation = your castle is safe & you attack. Combat = RPS (counter units); drop enemy rallies fast. ⚡ DIFFERENT from the INTERNAL King’s Castle Battle (~day 54, biweekly) that appoints YOUR OWN kingdom’s King — see the Castle tab.","Format INTERNAL (dalam kingdom) — aliansi menang menunjuk King. Biweekly (~14h, Sabtu). (±50-54)":"INTERNAL format (within your kingdom) — winning alliance appoints the King. Biweekly (~14d, Saturday). (±50-54)","Rally beruang bareng aliansi (TANPA stamina — rally Bear Trap tidak makan stamina, bisa join sebanyak mungkin). Beruang = INFANTRY → ARCHER +10%. Sumber utama Forgehammer. ⚠ Hanya bisa serang SATU KALI per siklus — pilih Trap 1 ATAU Trap 2 sesuai jam onlinemu; sudah ikut satu, BT berikutnya muncul siklus depan.":"Rally the bear with your alliance (NO stamina — Bear Trap rallies cost no stamina, join as many as you can). Bear = INFANTRY → ARCHER +10%. Main Forgehammer source. ⚠ You can only attack ONCE per cycle — pick Trap 1 OR Trap 2 by your online hours; once you join one, the next BT appears next cycle.","🐻 Ikut Bear Hunt (Bear Trap) harian — sumber Forgehammer utama (rally aliansi, TANPA stamina). Diana hemat stamina hanya untuk berburu beast di MAP, bukan Bear Trap.":"🐻 Join Bear Hunt (Bear Trap) daily — main Forgehammer source (alliance rally, NO stamina). Diana saves stamina only for hunting beasts on the MAP, not Bear Trap.","PvE · hero Diana · sink stamina":"PvE · hero Diana · stamina sink","event 3 hari · ~biweekly (hilang di Gen 4, diganti Champion’s Way)":"a 3-day event · ~biweekly (gone in Gen 4, replaced by Champion’s Way)","Buru beast di MAP pakai stamina (~8/hunt) → drop Clawshard & Challenger Pouch. MISI UTAMA: Hunt 10 Dreadwolves — kamu harus INISIASI 10 rally sendiri, JOIN tidak dihitung! → 10 shard Diana (maks 500 shard/event). Diana = hero unggulannya: hemat stamina utk hunt & MULAI rally + march lebih cepat — selalu bawa dia. Clawshard dipakai untuk hunt; baru bisa ditukar jadi Challenger Pouch SETELAH Diana 5★. Isi 1 pouch: PASTI 5-10 mnt General Speedup + PASTI 1.000 Hero XP; 20% → 100 gem, 50% → 10-30 gem (rata-rata ~30 gem/pouch), 15% → 1 stamina. F2P: sebelum Diana 5★ TAHAN claw untuk shard dulu; sesudah 5★, claw→pouch = tempat bagus membuang stamina sisa (gem + speedup + Hero XP), dan shard Diana berlebih bisa di-scrap di Champagne Fair. TAHAN speedup hasilnya untuk hari City Construction (SG D1 / KvK D1 / stage Construction HoG) biar dobel jadi poin event. Dahulukan Cesare’s Fury / Defeat Nearby Beasts kalau lagi aktif (poin ranking + shard Mythic). Ini beast MAP — beda dari Bear Hunt yang TANPA stamina.":"Hunt beasts on the MAP with stamina (~8/hunt) → drops Clawshards & Challenger Pouches. MAIN MISSION: Hunt 10 Dreadwolves — you must INITIATE 10 rallies yourself, JOINING does NOT count! → 10 Diana Shards (max 500 shards/event). Diana is the featured hero: saves stamina for hunting & STARTING rallies + faster march — always bring her. Clawshards are used to hunt; they can only be exchanged for Challenger Pouches AFTER Diana is 5★. One pouch holds: GUARANTEED 5-10 min General Speedup + GUARANTEED 1,000 Hero XP; 20% → 100 gems, 50% → 10-30 gems (~30 gems/pouch on average), 15% → 1 stamina. F2P: before Diana is 5★, HOLD the claws for shards; after 5★, claw→pouch is a good place to dump leftover stamina (gems + speedup + Hero XP), and surplus Diana shards can be scrapped at the Champagne Fair. HOLD the speedups you get for a City Construction day (SG D1 / KvK D1 / HoG Construction stage) so they double as event points. Prioritise Cesare’s Fury / Defeat Nearby Beasts if either is running (ranking points + Mythic shards). This is MAP beasts — different from Bear Hunt, which costs NO stamina.","ℹ Hari 70 = ELIGIBILITY terbuka (paling cepat), bukan tanggal pasti. KvK butuh lawan matchmaking — tanpa lawan sepadan, bulan ini batal → \"Matchmaking Bye Rewards\". Acuan final = tab Events in-game.":"ℹ Day 70 = ELIGIBILITY opens (earliest possible), not a fixed date. KvK needs a matchmaking opponent — with no fair match, it is skipped that month → \"Matchmaking Bye Rewards\". Final source = the in-game Events tab.","estimasi · eligibility, belum tentu terjadi":"estimate · eligibility, not guaranteed to happen","= perkiraan kasar (fix setelah kejadian pertama).":"= rough estimate (locks in after the first occurrence).","KvK hari 70 = eligibility TERBUKA (paling cepat), bukan jadwal pasti":"KvK day 70 = eligibility OPENS (earliest possible), not a fixed schedule","— tanpa lawan matchmaking bulan itu batal (Matchmaking Bye). Advisory \"Hari Ini\" tetap jalan otomatis — kalau tanggal asli di game beda, tekan \"ralat\" di bawah.":"— with no matchmaking opponent it is skipped that month (Matchmaking Bye). The \"Today\" advisory still runs automatically — if the real in-game date differs, hit \"fix\" below.","Tidak ada event aktif/akan datang ≤7 hari.":"No active/upcoming events within 7 days.","dihitung dari umur kingdom":"computed from kingdom age","jadwal global KvK · dari feed":"global KvK schedule · from feed","📡 Tanggal dari jadwal GLOBAL KvK (semua kingdom serentak, siklus 28 hari) — umur kingdom-mu sudah lewat gerbang H70. Tetap tidak dijamin: tanpa lawan sepadan → \"Matchmaking Bye Rewards\".":"📡 Date from the GLOBAL KvK schedule (all kingdoms at once, 28-day cycle) — your kingdom has already passed the day-70 gate. Still not guaranteed: with no fair opponent → \"Matchmaking Bye Rewards\".","Lainnya":"More","Ringkas":"Collapse","Rencana TC":"TC Plan","Ensiklopedia":"Encyclopedia","Jadwal Live":"Live Schedule","Aliansi & King":"Alliance & King","Rotasi global kingshot.net — kingdom muda bisa beda; acuan final tab Events in-game. Detail: tab Event → Jadwal Live.":"Global kingshot.net rotation — young kingdoms can differ; the in-game Events tab is the final source. Details: Event tab → Live Schedule.","Event PERTUMBUHAN berbasis umur server (HoG · KvK · SG · Burst · Milestone). Event mingguan aliansi ada di sub-tab \"Jadwal Live\".":"GROWTH events driven by server age (HoG · KvK · SG · Burst · Milestone). Weekly alliance events live in the \"Live Schedule\" sub-tab.","Jadwal live belum termuat. Buka tab Event → Jadwal Live, atau cek koneksi.":"Live schedule not loaded yet. Open the Event tab → Live Schedule, or check your connection.","◷ Event terdekat":"◷ Soonest events","◷ Sebulan ke depan":"◷ The month ahead","◷ Event server-mu":"◷ Your server's events","Tahan gem":"Hold gems","Tahan Widget":"Hold Widget","Tahan:":"Hold:","Harian":"Daily","Perang & Event":"War & Events","Kemajuan":"Progress","Truegold Lv1-3. Wajib sudah TC30! (±59-70)":"Truegold Lv1-3. Must already be TC30! (±59-70)","Event milestone kenaikan POWER dalam window event — mirip Burst of Life: power dari upgrade/riset/training/hero dihitung, tiap ambang = chest. F2P: Tahan penyelesaian upgrade & riset besar untuk diselesaikan DI DALAM window-nya (idealnya barengan hari konstruksi HoG/SG = poin dobel). Tidak perlu spend khusus.":"POWER-gain milestone event within a window — like Burst of Life: power from upgrades/research/training/heroes counts, each threshold = a chest. F2P: Hold big upgrade & research completions to finish them INSIDE the window (ideally on HoG/SG construction days = double dip). No dedicated spending needed.","Undian — pakai tiket/attempt gratis harian saja, jangan beli.":"A lottery — use only the free daily tickets/attempts, don't buy.","Event kompetitif solo tiap 14 hari (mulai H6). Hanya muncul di Generasi 1-2 kingdom. Hero of the Season + susunan stage BERUBAH tiap iterasi. Reward: 4 tier milestone (gratis, tier akhir = gem + skill book) + shard hero dari leaderboard.":"Solo competitive event every 14 days (starts Day 6). Only appears in a kingdom’s Generation 1-2. The Hero of the Season + stage layout CHANGE each iteration. Rewards: 4 milestone tiers (free, final tier = gems + skill book) + hero shards from the leaderboard.","🎁 Milestone reward 4 tier bisa diraih gratis walau tak masuk leaderboard. Tier akhir = gem + skill book — selalu kejar.":"🎁 The 4 milestone reward tiers are reachable free even without ranking on the leaderboard. Final tier = gems + skill book — always chase it.","Semua stat + VIP + Skin + Oasis":"All stats + VIP + Skin + Oasis","PILIH 1 LANE (1 player = 1 lane). KUAT (top-20 power aliansi) → masuk lane yang DITUMPUK (strategi 2-1: menang 2 dari 3 lane). LEMAH (di luar top-20) → bebas / lane korban; skor tak dihitung tapi TETAP hadir utk reward. Ikut arahan R4/R5. Deploy 3 hero (1 per kelas) + troop SEBELUM tanding (yg lagi march/heal tak ikut). Counter lawan (RPS): vs Inf → Archer 30/20/50 · vs Cav → Inf 60/10/30 · vs Archer → Cav 30/50/20. Aktifkan semua buff sebelum registrasi (snapshot LOCK). Ambil 2 kill/ronde.":"PICK 1 LANE (1 player = 1 lane). STRONG (top-20 alliance power) → join the STACKED lane (2-1 strategy: win 2 of 3 lanes). WEAK (outside top-20) → free / sacrifice lane; score doesn't count but STILL show up for the reward. Follow R4/R5. Deploy 3 heroes (1 per class) + troops BEFORE the match (units marching/healing don't join). Counter (RPS): vs Inf → Archer 30/20/50 · vs Cav → Inf 60/10/30 · vs Archer → Cav 30/50/20. Turn ON all buffs before registration (snapshot LOCK). Get 2 kills/round.","Advisory otomatis: kapan tahan item, kapan pakai, dan jam berapa — digerakkan umur server. (Kalender kini tab tersendiri.)":"Automatic advisory: when to hold items, when to use, and at what time — driven by server age. (Calendar is now its own tab.)","Ujian pamungkas: Semua sumber stat berlaku + pakai TROOP SENDIRI (tier tinggi spt True Gold+ unggul besar). Hero sama seperti Coliseum; hindari hero ekonomi (Diana). Stage dalam butuh 3 team.":"Ultimate test: All stat sources apply + you use YOUR OWN TROOPS (high tiers like True Gold+ dominate). Heroes same as Coliseum; avoid economy heroes (Diana). Deep stages need 3 teams.","Event login harian 30 hari untuk pemain baru — tiap login buka reward (shard hero, gem, dll). F2P: LOGIN tiap hari & klaim track gratis; jangan beli track Epic berbayar. Beda dari Path of Growth (task 7 hari) & Dawn Expedition.":"30-day daily login event for new players — each login unlocks rewards (hero shards, gems, etc). F2P: LOGIN every day & claim the free track; don't buy the paid Epic track. Different from Path of Growth (7-day tasks) & Dawn Expedition.","Perayaan ulang tahun server — milestone &         else if (orig.has(m.target) && m.target.nodeValue !== orig.get(m.target)){
          orig.delete(m.target); /* app wrote new ID text in-place — drop the stale original */
        }
        continue;
      }
      if (LANG !== 'en') continue;   /* additions need no work in Indonesian mode */
      for (var j=0;j<m.addedNodes.length;j++){
        var nd = m.addedNodes[j];
        if (nd.nodeType === 3){ if(!skip(nd)) setNode(nd); }
        else if (nd.nodeType === 1) translateTree(nd);
      }
    }
  });

  function start(){
    try { observer.observe(document.documentElement, {childList:true, subtree:true, characterData:true}); } catch(e){}
    translateTree(document.body || document.documentElement);
  }

  /* Toggle entry point used by the header button (event-delegated below). */
  window.setLang = function(l){
    LANG = l;
    try { localStorage.setItem('ks_lang', JSON.stringify(l)); } catch(e){}
    var btn = document.getElementById('langtoggle');
    if (btn) btn.textContent = (l === 'en') ? 'ID' : 'EN';
    /* regenerate dynamic UI (fresh Indonesian), then re-apply language */
    try { if (typeof buildNav === 'function') buildNav(); } catch(e){}
    try { if (typeof renderTopClock === 'function') renderTopClock(); } catch(e){}
    try {
      if (typeof activate === 'function'){
        var last = (window.store && store.get) ? store.get('lastTab','sekarang') : 'sekarang';
        activate(last);
      }
    } catch(e){}
    translateTree(document.body);
  };

  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest ? e.target.closest('#langtoggle') : null;
    if (t){ e.preventDefault(); window.setLang(LANG === 'en' ? 'id' : 'en'); }
  }, true);

  /* set initial button label once DOM is live */
  function syncBtn(){ var b=document.getElementById('langtoggle'); if(!b) return;
    /* globe + active language via textContent (auto-ignored by translator) */
    b.textContent = (LANG==="en") ? "ID" : "EN"; b.setAttribute("title","Ganti bahasa / Switch language");
    b.setAttribute('title','Ganti bahasa / Switch language'); }

  /* Wrap the app's render entry points so a tab switch / clock tick translates
     synchronously (no flash of Indonesian). The app modules load AFTER this
     inline script, so we wrap on the next macrotask once they're defined.
     A global function declaration is a property of window, so reassigning it
     redirects later identifier lookups inside the modules too. */
  function wrap(name){
    var orig = window[name];
    if (typeof orig !== 'function' || orig.__i18nWrapped) return;
    var w = function(){ var r = orig.apply(this, arguments); if (LANG === 'en') translateTree(document.body); return r; };
    w.__i18nWrapped = true;
    try { window[name] = w; } catch(e){}
  }
  window.__translate = function(){ translateTree(document.body); };

  start();
  syncBtn();
  /* NOTE: renderTopClock is intentionally NOT wrapped — it runs every second
     via tickClock, and a full-body translateTree per tick is a serious perf
     drain on phones. The MutationObserver picks up its innerHTML writes.
     The app modules load AFTER this inline script (the loader executes them
     one by one), so poll until the functions actually exist before wrapping. */
  var _wrapTries = 0;
  var _wrapTimer = setInterval(function(){
    ['activate','buildNav'].forEach(wrap);
    syncBtn();
    var done = window.activate && window.activate.__i18nWrapped;
    if (done && LANG === 'en') translateTree(document.body);
    if (done || ++_wrapTries > 50) clearInterval(_wrapTimer);
  }, 150);
})();
