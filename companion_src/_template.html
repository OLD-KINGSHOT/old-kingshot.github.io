<style>/* ============================================================
   KINGSHOT COMPANION — ALPHA13 tactical HUD theme
   ============================================================ */
:root{
  --bg:#0d1219; --bg-2:#161d28; --bg-3:#1f2836; --bg-4:#28323f; --bg-term:#080c12;
  --bd:#28323f; --bd-strong:#3a4658; --bd-soft:#1e2733;
  --fg:#edf1f7; --fg-mute:#aeb8c7; --fg-dim:#96a2b4; --fg-faint:#7c8698;
  --accent:#6b93f2; --accent-dim:#5580e6; --cyan:#3fb6c0; --pink:#e8618f;
  --profit:#37b877; --warn:#e0a13e; --loss:#f0654a;
  --font-ui:"Inter","Helvetica Neue",-apple-system,system-ui,sans-serif;
  /* REDESIGN "Studio": font mono dulu dipakai di 55 tempat — termasuk nav, label,
     judul tabel, tombol — sehingga app terbaca seperti terminal, bukan produk.
     Sekarang --font-mono = sans (semua teks antarmuka ikut berubah sekaligus),
     dan angka/jam/kode dipindahkan ke --font-num yang tetap monospace. */
  --font-mono:"Inter","Helvetica Neue",-apple-system,system-ui,sans-serif;
  --font-num:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow-card:0 2px 6px rgba(0,0,0,.18),0 16px 38px rgba(0,0,0,.34);
  --glow:0 0 20px rgba(107,147,242,.16);
  --offset:5px 5px 0 rgba(107,147,242,.10);
  --scan:repeating-linear-gradient(0deg,rgba(255,255,255,.006) 0 1px,transparent 1px 6px);
  --rtl:radial-gradient(ellipse 70% 50% at 18% 12%,rgba(107,147,242,.05),transparent 60%);
  --rbr:radial-gradient(ellipse 55% 45% at 85% 90%,rgba(107,147,242,.03),transparent 60%);
  --ease:cubic-bezier(.4,0,.2,1);
  --side:218px;
  --rad:16px; --rad-s:11px;
  --shadow-soft:0 3px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 90% 55% at 12% -8%,rgba(107,147,242,.11),transparent 55%),radial-gradient(ellipse 85% 60% at 96% 104%,rgba(86,116,224,.09),transparent 55%),radial-gradient(circle at 50% 26%,rgba(22,32,58,.30),transparent 72%)}
/* persistent subtle starfield behind the whole app */
#app_stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.42}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
a{color:var(--cyan);text-decoration:none}
::selection{background:rgba(107,147,242,.25)}

/* tactical label */
.lbl{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--fg-dim)}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh;position:relative;z-index:1}
/* ---- Sidebar (desktop) ---- */
.side{position:fixed;top:0;left:0;bottom:0;width:var(--side);z-index:40;
  background:var(--bg-2);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;padding:0}
.side .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--bd)}
.side .brand .a{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--accent);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(107,147,242,.3);background:rgba(107,147,242,.12);border-radius:10px;flex:0 0 auto}
.side .brand .wm{font-weight:700;font-size:15px;letter-spacing:.04em;line-height:1.1}
.side .brand .wm small{display:block;font-family:var(--font-mono);font-size:9px;font-weight:600;
  letter-spacing:.14em;color:var(--fg-dim);text-transform:uppercase;margin-top:2px}
.navlist{flex:1;overflow-y:auto;padding:10px 8px}
.navbtn{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;margin:3px 0;
  background:transparent;border:0;border-radius:10px;color:var(--fg-mute);
  font-family:var(--font-ui);font-size:14px;font-weight:600;cursor:pointer;transition:.14s var(--ease);
  text-align:left;letter-spacing:.01em}
.navbtn .gi{font-family:var(--font-mono);font-size:16px;width:20px;text-align:center;flex:0 0 auto}
.navbtn:hover{background:var(--bg-3);color:var(--fg)}
.navbtn.active{background:var(--accent);color:#0b1220;font-weight:700;box-shadow:0 4px 14px rgba(107,147,242,.30)}
.side .sidefoot{padding:12px 14px;border-top:1px solid var(--bd);font-family:var(--font-mono);
  font-size:9px;color:var(--fg-faint);letter-spacing:.08em;line-height:1.6}

/* ---- Topbar ---- */
.main{flex:1;margin-left:var(--side);display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:9px 22px;background:rgba(9,12,17,.8);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--bd);min-height:50px}
.clockwrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.clk{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--fg);letter-spacing:.02em}
.clk .wib{font-size:10px;color:var(--fg-dim);font-weight:600}
.clk .nosync{color:var(--warn)}
.clkmeta{font-family:var(--font-mono);font-size:11px;color:var(--fg-mute);letter-spacing:.04em}
.clkmeta b{color:var(--accent)}
.clkmeta .hot{color:var(--warn)}
.tb-spacer{flex:1}
.engine{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;
  background:rgba(107,147,242,.08);color:var(--accent);border:1px solid rgba(107,147,242,.3);
  font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.engine::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:pulse 2s var(--ease) infinite}
.engine.off{color:var(--fg-dim);border-color:var(--bd-strong);background:transparent}
.engine.off::before{background:var(--fg-dim);animation:none}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  background:var(--bg-card,#11151E);border:1px solid var(--bd);color:var(--fg-mute);cursor:pointer;
  font-family:var(--font-mono);font-size:15px;transition:.12s var(--ease)}
#langtoggle{width:auto;min-width:34px;padding:0 9px;gap:4px}
#langtoggle::before{content:"🌐";font-size:12px;opacity:.75}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}

.content{padding:30px 28px;max-width:1240px;margin:0 auto;width:100%}
.tab{display:none}
.tab.active{display:block;animation:fade .28s var(--ease) both}
@keyframes fade{from{transform:translateY(7px)}to{transform:none}}
.pagehead{margin:2px 0 18px}
.pagehead h1{font-size:28px;font-weight:800;letter-spacing:-.025em;margin:0}
.pagehead p{color:var(--fg-mute);font-size:14.5px;margin:9px 0 0;max-width:64ch}

/* ============ CARD ============ */
.card{position:relative;overflow:hidden;background:var(--bg-2);
  border:1px solid var(--bd);border-radius:var(--rad);box-shadow:var(--shadow-card);margin-bottom:22px}
.card.hud::before,.card.hud::after{content:"";position:absolute;width:13px;height:13px;
  border-color:var(--accent);border-style:solid;z-index:2}
.card.hud::before{top:0;left:0;border-width:1px 0 0 1px}
.card.hud::after{bottom:0;right:0;border-width:0 1px 1px 0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 21px;border-bottom:1px solid var(--bd)}
.card-h h2{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:700;margin:0;letter-spacing:-.01em}
.card-h h2 .gi{font-family:var(--font-mono);color:var(--accent);font-size:15px}
.card-h .meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);letter-spacing:.06em}
.card-b{padding:19px 21px}
.card-b>p:first-child{margin-top:0}
.card-b h3{font-size:12.5px;font-weight:700;font-family:var(--font-ui);letter-spacing:.01em;
  text-transform:none;color:var(--fg);margin:18px 0 9px}
.card-b h3:first-child{margin-top:0}
.muted{color:var(--fg-mute);font-size:12px}
.small{font-size:11.5px}
.dim{color:var(--fg-dim)}

/* ============ HERO / NOW HUD ============ */
.nowhud{position:relative;overflow:hidden;border:1px solid rgba(107,147,242,.22);
  background:linear-gradient(135deg,rgba(107,147,242,.07),rgba(17,21,30,.9) 45%,rgba(11,14,19,.96));
  box-shadow:var(--offset);padding:20px;margin-bottom:18px}
.nowhud .wmk{position:absolute;right:-12px;top:-26px;font-size:120px;font-weight:700;line-height:1;
  color:rgba(255,255,255,.025);font-family:var(--font-ui);letter-spacing:-.05em;pointer-events:none;z-index:0}
.nowhud .corner{position:absolute;width:14px;height:14px;border:1px solid var(--cyan);opacity:.5;z-index:2}
.nowhud .c1{top:8px;left:8px;border-right:0;border-bottom:0}
.nowhud .c2{bottom:8px;right:8px;border-left:0;border-top:0}
.nowhud .inner{position:relative;z-index:1}
.nowhud .dayrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.nowhud .bigday{font-family:var(--font-mono);font-size:42px;font-weight:700;color:var(--accent);
  line-height:.95;letter-spacing:-.01em}
.nowhud .bigday small{font-size:15px;color:var(--fg-mute);font-weight:600;margin-left:4px}
.nowhud .bigclock{font-family:var(--font-mono);font-size:30px;font-weight:700;line-height:1;letter-spacing:.02em}
.nowhud .resetline{font-family:var(--font-mono);font-size:12px;color:var(--fg-mute);margin-top:10px}
.nowhud .resetline b{color:var(--cyan)}

/* ============ STAT GRID ============ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{position:relative;background:var(--bg-2);
  border:1px solid var(--bd);border-left:2px solid var(--bd-strong);padding:13px 14px;display:flex;flex-direction:column;gap:5px}
.stat.ok{border-left-color:var(--profit)}.stat.warn{border-left-color:var(--warn)}
.stat.crit{border-left-color:var(--loss)}.stat.acc{border-left-color:var(--accent)}
.stat .sl{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fg-dim)}
.stat .sv{font-family:var(--font-mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);line-height:1}
.stat .sv.sm{font-size:16px}
.stat .ss{font-family:var(--font-mono);font-size:10px;color:var(--fg-mute);line-height:1.3}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;background:linear-gradient(180deg,#7ba0f6,#5580e6);color:#0b1220;
  font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.01em;
  border:0;cursor:pointer;transition:.14s var(--ease);
  border-radius:10px}
.btn:hover{background:var(--accent-dim);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.sec{background:var(--bg-2);color:var(--fg);border:1px solid var(--bd-strong);clip-path:none;
  letter-spacing:.04em;text-transform:none;font-weight:600}
.btn.sec:hover{background:var(--bg-3);border-color:var(--accent);transform:none}
.btn.ghost{background:transparent;color:var(--cyan);border:1px solid var(--bd);clip-path:none;
  letter-spacing:.04em;text-transform:none;font-weight:600;padding:7px 12px;font-size:11.5px}
.btn.ghost:hover{border-color:var(--cyan);background:rgba(63,182,192,.06);transform:none}
.btn.sm{padding:6px 12px;font-size:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ============ INPUTS ============ */
label.fl{display:block;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fg-dim);margin:14px 0 6px}
input,select{width:100%;padding:11px 12px;background:var(--bg-term);border:1px solid var(--bd-strong);
  color:var(--fg);font-family:var(--font-mono);font-size:14px;outline:0;transition:.14s var(--ease);border-radius:0}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============ PILLS ============ */
.pill{display:inline-flex;align-items:center;padding:3px 8px;border:1px solid var(--bd);
  font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.pill.f2p{background:rgba(0,229,160,.15);color:var(--profit);border-color:rgba(0,229,160,.4)}
.pill.warn{background:rgba(255,180,84,.15);color:var(--warn);border-color:rgba(255,180,84,.4)}
.pill.crit{background:rgba(255,70,85,.2);color:var(--loss);border-color:rgba(255,70,85,.5)}
.pill.info{background:rgba(63,182,192,.12);color:var(--cyan);border-color:rgba(63,182,192,.35)}
.pill.s{background:rgba(107,147,242,.16);color:var(--accent);border-color:rgba(107,147,242,.4)}
.pill.a{background:rgba(63,182,192,.12);color:var(--cyan);border-color:rgba(63,182,192,.3)}
.pill.b{background:rgba(138,147,166,.13);color:var(--fg-mute);border-color:var(--bd-strong)}
.pill.c{background:rgba(92,100,120,.12);color:var(--fg-dim);border-color:var(--bd)}
.pill.gen6{background:rgba(255,45,111,.14);color:var(--pink);border-color:rgba(255,45,111,.35)}
.tag{display:inline-flex;align-items:center;background:var(--bg-2);border:1px solid var(--bd);color:var(--fg-mute);
  padding:3px 8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;margin:2px 3px 0 0}

/* ============ ALERTS ============ */
.alert{padding:10px 13px;margin:9px 0;font-size:12.5px;line-height:1.5;border:1px solid;border-left-width:2px}
.alert.ok{background:rgba(0,229,160,.07);border-color:rgba(0,229,160,.4);color:#9af0d2}
.alert.warn{background:rgba(255,180,84,.07);border-color:rgba(255,180,84,.4);color:#ffd9a6}
.alert.bad{background:rgba(255,70,85,.07);border-color:rgba(255,70,85,.45);color:#ffb3ba}
.alert.inf{background:rgba(63,182,192,.06);border-color:rgba(63,182,192,.35);color:#a9e9f2}
.alert b{font-weight:700}

/* ============ CHECK ROWS ============ */
.check{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border:1px solid var(--bd);
  margin:7px 0;background:var(--bg-2);transition:.12s var(--ease)}
.check:hover{border-color:var(--bd-strong)}
.check input[type=checkbox]{width:18px;height:18px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--accent);cursor:pointer}
.check.done{opacity:.45}
.check.done .t{text-decoration:line-through}
.check .t{font-weight:600;font-size:13px}
.check .d{font-size:11.5px;color:var(--fg-mute);margin-top:2px}
.check.note{cursor:default}

/* ============ FOCUS CARDS (now) ============ */
.fcard{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--bd);
  background:var(--bg-2);margin:8px 0;cursor:pointer;transition:.12s var(--ease)}
.fcard:hover{border-color:var(--accent);background:var(--bg-3)}
.fcard .fi{font-family:var(--font-mono);font-size:18px;color:var(--accent);width:22px;text-align:center;flex:0 0 auto}
.fcard .ft{font-weight:700;font-size:13px}
.fcard .fd{font-size:11.5px;color:var(--fg-mute);margin-top:2px;line-height:1.4}
.fcard .fg{margin-left:auto;color:var(--fg-dim);font-family:var(--font-mono);flex:0 0 auto}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:4px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:15px 8px;border:1px solid var(--bd);
  background:var(--bg-2);cursor:pointer;transition:.12s var(--ease);color:var(--fg)}
.qbtn:hover{border-color:var(--accent);background:var(--bg-3)}
.qbtn .qi{font-family:var(--font-mono);font-size:22px;color:var(--accent)}
.qbtn .ql{font-size:11px;font-weight:700;text-align:center}

/* ============ KV / TABLE ============ */
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--fg-mute)}
.kv b{color:var(--fg);text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.kv b.acc{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);border-bottom:1px solid var(--bd-strong)}
tr:nth-child(even) td{background:rgba(255,255,255,.012)}
td b{font-weight:700}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* build calculator */
.calcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.calcf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg-mute)}
.calcf span{letter-spacing:.02em}
.calcf input[type=number],.calcf select{background:var(--bg-2);border:1px solid var(--bd);color:var(--fg);border-radius:var(--rad-s);padding:9px 10px;font-size:15px;font-variant-numeric:tabular-nums;width:100%}
.calcf input:focus,.calcf select:focus{outline:none;border-color:var(--accent)}
.calcf.chk{flex-direction:row;align-items:center;gap:8px;grid-column:1/-1;color:var(--fg)}
.calcf.chk input{width:18px;height:18px;accent-color:var(--accent)}
.calcout{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px;padding:12px;background:var(--bg-2);border:1px solid var(--bd);border-radius:var(--rad-s)}
.calcrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.calcrow>span:first-child{color:var(--fg-mute);font-size:13px}
.calcrow .num{font-size:17px;font-variant-numeric:tabular-nums}
.calcrow .ok,.calcout .ok{color:var(--win,#5bd6a0)}
@media(max-width:480px){.calcgrid{grid-template-columns:repeat(2,1fr)}}
/* Castle Battle map */
.cbmap{width:100%;max-width:420px;margin:6px auto 4px;display:block}
.cbmap .fzone{fill:rgba(200,67,79,.05);stroke:rgba(200,67,79,.5);stroke-width:1.5;stroke-dasharray:5 5}
.cbmap .fz-lbl{fill:#c8737a;font-size:9px;font-family:var(--font-mono)}
.cbmap .turret circle{stroke:rgba(255,255,255,.25);stroke-width:1.5;transition:fill .15s}
.cbmap .turret.enemy circle{fill:#b8404b}
.cbmap .turret.us circle{fill:#3f9e6f}
.cbmap .turret.contested circle{fill:#d1a24a}
.cbmap .turret:focus{outline:none}
.cbmap .turret:focus circle{stroke:var(--accent);stroke-width:2.5}
.cbmap .tl{fill:#fff;font-size:15px}
.cbmap .tn{fill:var(--fg-mute);font-size:8.5px;font-family:var(--font-mono)}
.cbmap .castle{fill:rgba(107,147,242,.18);stroke:var(--accent);stroke-width:2}
.cbmap .cico{font-size:22px}
.cbmap .cn{fill:var(--fg);font-size:10px;font-weight:700;font-family:var(--font-mono)}
.cbmap .stage{fill:var(--fg-dim);font-size:9px;font-family:var(--font-mono)}
.cbleg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:2px 0 8px;font-size:11px;color:var(--fg-mute)}
.cbleg i.d{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:3px}
.cbleg i.us{background:#3f9e6f}.cbleg i.enemy{background:#b8404b}.cbleg i.contested{background:#d1a24a}.cbleg i.base{background:#6b93f2}
.cbdir{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--fg-mute);margin:4px 0 8px}
.cbdir #cb_dir{display:flex;gap:5px;flex-wrap:wrap}
.cbdir button{background:var(--bg-2);border:1px solid var(--bd);color:var(--fg-mute);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-mono)}
.cbdir button.active{background:rgba(107,147,242,.14);border-color:var(--accent);color:var(--accent)}
.cbmap .rl-atk{stroke:#c8434f;stroke-width:2.5;stroke-dasharray:6 4;opacity:.85}
.cbmap .rl-tur{stroke:#3f9e6f;stroke-width:2.5;opacity:.85}
.cbmap .turhi{fill:none;stroke:#3f9e6f;stroke-width:2.5;stroke-dasharray:3 3;opacity:.9}
.cbmap .ourbase{fill:#6b93f2;stroke:#fff;stroke-width:1.5}
.cbmap .obt{font-size:15px}
textarea{background:var(--bg-2);border:1px solid var(--bd);color:var(--fg);border-radius:var(--rad-s);padding:10px 12px;font:inherit;font-size:14px;line-height:1.5;resize:vertical;min-height:96px}
textarea:focus{outline:none;border-color:var(--accent)}
/* narrow screens: tighter cells + keep pills/day-ranges on one line */
@media(max-width:480px){
  th,td{padding:7px 6px}
  table{font-size:12px}
  td .pill,td.num{white-space:nowrap}
  /* button rows (mode/situation pickers): wrap instead of off-screen horizontal scroll */
  .seg{flex-wrap:wrap;overflow-x:visible}
}

/* ============ LINEUP CARD ============ */
.lcard{border:1px solid var(--bd-strong);background:linear-gradient(180deg,rgba(107,147,242,.04),var(--bg-2));
  padding:13px 14px;margin:10px 0}
.lcard .lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.lcard .lh .nm{font-weight:700;font-size:14px;color:var(--accent);letter-spacing:.01em}
.rolechip{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border:1px solid}
.rolechip.rally{color:#ff9a6b;border-color:#ff9a6b66;background:#ff9a6b14}
.rolechip.garrison{color:var(--cyan);border-color:rgba(63,182,192,.4);background:rgba(63,182,192,.1)}
.rolechip.defense{color:var(--profit);border-color:rgba(0,229,160,.4);background:rgba(0,229,160,.1)}
.rolechip.pvp{color:var(--loss);border-color:rgba(255,70,85,.4);background:rgba(255,70,85,.1)}
.herochips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.herochips .hc{background:var(--bg-term);border:1px solid var(--bd-strong);padding:5px 9px;font-size:12px;font-weight:700}
.herochips .hc small{color:var(--fg-dim);font-weight:400;font-family:var(--font-mono)}
.rbar{display:flex;height:22px;overflow:hidden;border:1px solid var(--bd);font-family:var(--font-mono);
  font-size:10px;font-weight:700;color:#0B0E13;font-variant-numeric:tabular-nums}
.rbar>span{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap}
.rbar .inf{background:var(--cyan)}.rbar .cav{background:var(--accent)}.rbar .arc{background:var(--profit)}
.rleg{font-family:var(--font-mono);font-size:10px;color:var(--fg-mute);margin-top:4px;letter-spacing:.02em}
.rleg b.inf{color:var(--cyan)}.rleg b.cav{color:var(--accent)}.rleg b.arc{color:var(--profit)}
.lrow{font-size:12px;margin-top:7px;line-height:1.45}
.lrow .lk{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--fg-dim);margin-right:6px}
.lrow.up .lk{color:var(--profit)}.lrow.no .lk{color:var(--warn)}
.lrow .doul{margin:5px 0 0;padding-left:15px;list-style:none}
.lrow .doul li{position:relative;margin:5px 0;line-height:1.5}
.lrow .doul li::before{content:'\25b9';position:absolute;left:-15px;color:var(--accent)}

/* ============ SEGMENTED PICKER ============ */
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.seg button{flex:0 0 auto;background:var(--bg-2);border:1px solid var(--bd);color:var(--fg-mute);
  padding:8px 13px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.04em;
  cursor:pointer;white-space:nowrap;transition:.12s var(--ease)}
.seg button:hover{color:var(--fg);border-color:var(--bd-strong)}
.seg button.active{background:rgba(107,147,242,.12);color:var(--accent);border-color:rgba(107,147,242,.45)}
.subnav{display:flex;gap:6px;margin-bottom:16px}
.subnav button{flex:1;background:var(--bg-2);border:1px solid var(--bd);color:var(--fg-mute);
  padding:10px 6px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;transition:.12s var(--ease)}
.subnav button.active{background:rgba(107,147,242,.12);color:var(--accent);border-color:rgba(107,147,242,.45)}

/* ============ DETAILS ============ */
details{border:1px solid var(--bd);background:var(--bg-2);margin:8px 0;padding:0}
details[open]{border-color:var(--bd-strong)}
summary{cursor:pointer;font-weight:700;font-size:13px;padding:11px 13px;list-style:none;display:flex;
  align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-family:var(--font-mono);color:var(--accent);font-weight:700;width:12px}
details[open] summary::before{content:"\2212"}
details>div,details>.dt{padding:0 13px 13px}

/* ============ CALENDAR ============ */
.calhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;gap:8px}
.calhead .mon{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--accent);letter-spacing:.04em}
.calnav{background:var(--bg-2);border:1px solid var(--bd-strong);color:var(--fg);padding:6px 13px;cursor:pointer;
  font-family:var(--font-mono);font-size:14px}
.calnav:hover{border-color:var(--accent);color:var(--accent)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.caldow{text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--fg-dim);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding-bottom:3px}
.calcell{min-height:52px;border:1px solid var(--bd);padding:4px 5px;background:var(--bg-2);cursor:pointer;
  position:relative;transition:.1s var(--ease)}
.calcell.empty{background:transparent;border:0;cursor:default;min-height:0}
.calcell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.calcell.has{background:linear-gradient(180deg,rgba(107,147,242,.1),var(--bg-2));border-color:var(--bd-strong)}
.calcell.sel{outline:1px solid var(--cyan);outline-offset:-2px}
.calcell:hover{border-color:var(--bd-strong)}
.calcell .dn{font-family:var(--font-mono);font-size:12px;font-weight:700;line-height:1.1}
.calcell .sd{font-family:var(--font-mono);font-size:8px;color:var(--fg-dim);position:absolute;top:4px;right:5px}
.cdots{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.cdot{width:7px;height:7px;display:inline-block}
.ctag{font-family:var(--font-mono);font-size:8.5px;font-weight:700;line-height:1;padding:2px 3px;border:1px solid var(--bd-strong);color:var(--fg-mute);letter-spacing:.02em;white-space:nowrap}
.ctag small{font-size:7px;opacity:.85}
.calcell.wk{position:relative}
.calcell.wk::after{content:'';position:absolute;left:4px;right:4px;bottom:2px;height:2px;background:var(--cyan);opacity:.45}
.callegend{font-family:var(--font-mono);font-size:10px;color:var(--fg-mute);margin-top:10px;line-height:1.8;letter-spacing:.02em}

hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
.center{text-align:center}

/* ============================================================
   HYBRID POLISH (2026-06-10) — core treatment overrides
   Appended block: later rules win at equal specificity.
   ============================================================ */
/* rounded surfaces */
.nowhud{border-radius:var(--rad)}
.lcard,details,.check,.fcard,.qbtn,.seg button,.subnav button,.alert,.calcell,.iconbtn,.engine,
.btn.sec,.btn.ghost,.stat,.herochips .hc,.calnav{border-radius:var(--rad-s)}
input,select{border-radius:var(--rad-s)}
.pill,.rolechip,.rbar{border-radius:4px}
.lcard,.stat{box-shadow:var(--shadow-soft)}
/* nav: lime pill instead of left border */
.navbtn{border-left:0;border-radius:8px}
.navbtn.active{background:rgba(107,147,242,.14);color:var(--accent);border-left:0;
  box-shadow:0 0 10px rgba(107,147,242,.12)}
/* kv rows: soft chips */
.kv{padding:8px 10px;margin:3px 0;background:rgba(255,255,255,.02);border-radius:var(--rad-s);
  border-bottom:0;font-size:13px}
/* table header */
th{background:rgba(17,21,30,.85)}

/* ---- readability: type-scale floor + line-height ---- */
.lbl{font-size:10.5px;letter-spacing:.14em}
.small{font-size:12px}
.muted{font-size:12.5px;line-height:1.45}
.card-h h2{font-size:14px}
.navbtn{font-size:14px;padding:12px}
.side .sidefoot{font-size:10px}
th{font-size:10.5px}
table{font-size:13px}
td{line-height:1.45}
.check .d{font-size:12px}
.stat .sl{font-size:10.5px}
.clkmeta{font-size:11.5px}
.fcard .fd{font-size:12px}
.qbtn .ql{font-size:11.5px}
.alert{font-size:13px}
.lrow{font-size:12.5px}
.callegend{font-size:10.5px}
.caldow{font-size:9.5px}
/* tap targets */
.iconbtn{width:38px;height:38px}

/* ============ MOBILE ============ */
.mobnav{display:none}
@media(max-width:860px){
  .side{display:none}
  .main{margin-left:0}
  .content{padding:16px 14px 84px}
  .topbar{padding:8px 14px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .qgrid{grid-template-columns:repeat(2,1fr)}
  .nowhud .bigday{font-size:34px}
  .nowhud .bigclock{font-size:24px}
  .pagehead h1{font-size:19px}
  /* bottom nav */
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(9,12,17,.96);backdrop-filter:blur(10px);border-top:1px solid var(--bd);
    padding:6px 4px env(safe-area-inset-bottom,6px);overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
  .mobnav::-webkit-scrollbar{display:none}
  .mobnav{touch-action:pan-x;user-select:none;-webkit-user-select:none;cursor:grab}
  .mobnav:active{cursor:grabbing}
  .mobnav .navbtn{flex:0 0 auto;width:auto;min-width:58px;flex-direction:column;gap:3px;padding:7px 9px;margin:0;border-left:0;border-bottom:2px solid transparent;
    font-size:9px;letter-spacing:.02em;align-items:center;text-align:center;white-space:nowrap;scroll-snap-align:center}
  .mobnav .navbtn .gi{font-size:17px;width:auto}
  .mobnav .navbtn.active{background:transparent;border-bottom-color:var(--accent);border-left:0}
  .mobnav .navbtn .nl{font-family:var(--font-mono);font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
}
@media(max-width:480px){
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .clk{font-size:14px}
}

/* ============================================================
   HYBRID POLISH (2026-06-10) — mobile nav, animations, extras
   ============================================================ */
@media(max-width:860px){
  .mobnav .navbtn{min-height:48px;font-size:10px;border-bottom:0;border-radius:8px;margin:0 2px}
  .mobnav .navbtn .gi{font-size:19px}
  .mobnav .navbtn .nl{font-size:10.5px;text-transform:none;letter-spacing:.02em}
  .mobnav .navbtn.active{background:rgba(107,147,242,.14);color:var(--accent);border-bottom:0}
}
/* staggered card entrance on tab switch */
.tab.active>.card,.tab.active>.nowhud{animation:cardin .32s var(--ease) both}
.tab.active>*:nth-child(2){animation-delay:.04s}
.tab.active>*:nth-child(3){animation-delay:.08s}
.tab.active>*:nth-child(4){animation-delay:.12s}
.tab.active>*:nth-child(5){animation-delay:.16s}
.tab.active>*:nth-child(6){animation-delay:.2s}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}}
/* pressed feedback */
.btn:active,.qbtn:active,.navbtn:active,.seg button:active,.subnav button:active,.iconbtn:active{transform:scale(.97)}
/* countdown progress bar */
.cdbar{height:3px;background:rgba(255,255,255,.05);border-radius:2px;margin:-1px 2px 6px;overflow:hidden}
.cdbar .cdfill{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width 1s linear}
/* last-minute blink */
.cd-hot{animation:cdblink 1s steps(2,start) infinite}
@keyframes cdblink{50%{opacity:.45}}
/* thin themed scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--fg-faint)}
html{scrollbar-width:thin;scrollbar-color:var(--bg-4) transparent}
/* backdrop-filter fallback */
@supports not (backdrop-filter:blur(10px)){
  .topbar{background:rgba(9,12,17,.97)}
  .mobnav{background:rgba(9,12,17,.98)}
}
/* small-phone fixes: topbar overflowed horizontally (page grew ~60px) */
@media(max-width:600px){
  body{overflow-x:hidden}
  .topbar{flex-wrap:wrap;gap:6px 10px;padding:8px 10px}
  .clockwrap{min-width:0}
  .engine{font-size:0;letter-spacing:0;padding:6px;gap:0}  /* status dot only */
  .mobnav .navbtn{min-width:0;margin:0 1px;padding:6px 1px}
  .mobnav .navbtn .gi{font-size:18px}
  .mobnav .navbtn .nl{font-size:9.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
/* sidebar profile/login button (bottom-left) */
.sideprofile{display:flex;align-items:center;gap:11px;margin:8px;padding:12px;width:calc(100% - 16px);
  background:var(--bg-2);border:1px solid var(--bd);border-radius:8px;cursor:pointer;color:var(--fg);
  font-family:var(--font-ui);text-align:left;transition:.12s var(--ease)}
.sideprofile:hover{border-color:var(--accent);background:var(--bg-3)}
.sideprofile.active{border-color:rgba(107,147,242,.45);background:rgba(107,147,242,.08)}
.sideprofile .spi{font-size:19px;flex:0 0 auto}
.sideprofile .spt b{display:block;font-size:13.5px;font-weight:700}
.sideprofile .spt small{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-dim);margin-top:2px}
.sideprofile.on .spt small{color:var(--profit)}
.profswitch{margin:0 8px 8px;width:calc(100% - 16px);background:var(--bg-3);color:var(--fg);
  border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-family:var(--font-mono);font-size:11px;cursor:pointer}
.profswitch:hover{border-color:var(--accent)}
.mtul{list-style:none;padding:0;margin:0;font-size:13px;color:var(--fg-dim)}
.mtul li{padding:4px 0 4px 18px;position:relative}
.mtul li::before{content:"▸";position:absolute;left:0;color:var(--accent)}
.mtul b{color:var(--fg)}
/* respect reduced motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ============================================================
   SK DESIGN SYSTEM — "Sekarang" tab redesign layer
   Transcribed verbatim (structure) from mockup sekarang-redesign.html.
   All tokens are prefixed --sk- so they never collide with the
   app's existing --bg/--fg/--accent/etc tokens above. All component
   rules are scoped under a .sk wrapper so this is purely additive.
   ============================================================ */
:root{
  --sk-bg:#f6f7f9; --sk-surface:#ffffff; --sk-surface-2:#eef0f4; --sk-line:#e2e5ec;
  --sk-ink:#1a2029; --sk-ink-soft:#464f5e; --sk-ink-faint:#69717f;
  --sk-accent:#3457d5; --sk-accent-soft:#e6ebfb;
  --sk-gold:#a9781a;
  --sk-inf:#3f6fbf; --sk-cav:#b07d24; --sk-arc:#c2542f;
  --sk-ok:#177d4e; --sk-ok-bg:#e4f2ea; --sk-warn:#9c6510; --sk-warn-bg:#f6ecd9; --sk-alert:#a63a2c; --sk-alert-bg:#f7e6e2;
  --sk-r:14px; --sk-shadow:0 1px 2px rgba(26,32,41,.05), 0 4px 16px rgba(26,32,41,.05);
  --sk-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sk-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --sk-bg:#0d1219; --sk-surface:#161d28; --sk-surface-2:#1f2836; --sk-line:#2a3442;
  --sk-ink:#edf1f7; --sk-ink-soft:#aeb8c7; --sk-ink-faint:#8590a1;
  --sk-accent:#6b93f2; --sk-accent-soft:#182741;
  --sk-gold:#d7a13a;
  --sk-inf:#6b9ae0; --sk-cav:#d7a545; --sk-arc:#e77953;
  --sk-ok:#37b877; --sk-ok-bg:#12281d; --sk-warn:#d69b3f; --sk-warn-bg:#2a2312; --sk-alert:#e8705a; --sk-alert-bg:#2c1a17;
  --sk-shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.38);
}}
:root[data-theme="light"]{--sk-bg:#f6f7f9;--sk-surface:#ffffff;--sk-surface-2:#eef0f4;--sk-line:#e2e5ec;--sk-ink:#1a2029;--sk-ink-soft:#464f5e;--sk-ink-faint:#69717f;--sk-accent:#3457d5;--sk-accent-soft:#e6ebfb;--sk-gold:#a9781a;--sk-inf:#3f6fbf;--sk-cav:#b07d24;--sk-arc:#c2542f;--sk-ok:#177d4e;--sk-ok-bg:#e4f2ea;--sk-warn:#9c6510;--sk-warn-bg:#f6ecd9;--sk-alert:#a63a2c;--sk-alert-bg:#f7e6e2;--sk-shadow:0 1px 2px rgba(26,32,41,.05),0 4px 16px rgba(26,32,41,.05);}
:root[data-theme="dark"]{--sk-bg:#0d1219;--sk-surface:#161d28;--sk-surface-2:#1f2836;--sk-line:#2a3442;--sk-ink:#edf1f7;--sk-ink-soft:#aeb8c7;--sk-ink-faint:#8590a1;--sk-accent:#6b93f2;--sk-accent-soft:#182741;--sk-gold:#d7a13a;--sk-inf:#6b9ae0;--sk-cav:#d7a545;--sk-arc:#e77953;--sk-ok:#37b877;--sk-ok-bg:#12281d;--sk-warn:#d69b3f;--sk-warn-bg:#2a2312;--sk-alert:#e8705a;--sk-alert-bg:#2c1a17;--sk-shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.38);}
.sk{--sk-bg:#0d1219;--sk-surface:#161d28;--sk-surface-2:#1f2836;--sk-line:#2a3442;--sk-ink:#edf1f7;--sk-ink-soft:#aeb8c7;--sk-ink-faint:#8590a1;--sk-accent:#6b93f2;--sk-accent-soft:#182741;--sk-gold:#d7a13a;--sk-inf:#6b9ae0;--sk-cav:#d7a545;--sk-arc:#e77953;--sk-ok:#37b877;--sk-ok-bg:#12281d;--sk-warn:#d69b3f;--sk-warn-bg:#2a2312;--sk-alert:#e8705a;--sk-alert-bg:#2c1a17;--sk-shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.38);}  /* .sk matches the always-dark app shell by default; data-theme="light" still overrides */

.sk *{box-sizing:border-box}
.sk{background:var(--sk-bg);color:var(--sk-ink);font-family:var(--sk-sans);-webkit-font-smoothing:antialiased;
  font-size:14px;line-height:1.5;letter-spacing:-.005em;overflow-wrap:break-word}
.sk .do,.sk .lineup,.sk .sub,.sk .pf-name,.sk .gc-note,.sk .cap,.sk .t,.sk .d,.sk .nm,.sk .rlabels{overflow-wrap:break-word;text-wrap:pretty}
.sk .ev,.sk .hero,.sk .giftcard,.sk .act{min-height:0}
.sk .wrap{max-width:1100px;margin:0 auto;padding:16px 20px}
.sk .tabular{font-variant-numeric:tabular-nums}
.sk button{font-family:inherit}
.sk .eyebrow{display:flex;align-items:baseline;gap:10px;margin:26px 2px 13px}
.sk .eyebrow h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--sk-ink-faint)}
.sk .eyebrow .hint{font-size:12px;color:var(--sk-ink-faint);margin-left:auto;font-weight:500}

.sk .card{background:var(--sk-surface);border:1px solid var(--sk-line);border-radius:var(--sk-r);box-shadow:var(--sk-shadow)}

.sk .profile{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 16px}
.sk .crest{width:44px;height:44px;border-radius:12px;background:linear-gradient(140deg,var(--sk-gold),var(--sk-cav));
  color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:var(--sk-shadow)}
.sk .pf-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sk .pf-idn{font-family:var(--sk-mono);font-size:11.5px;font-weight:500;color:var(--sk-ink-faint)}

.sk .pf-clock .reset b{font-family:var(--sk-mono);color:var(--sk-ink);font-weight:600}
.sk .dot{width:7px;height:7px;border-radius:50%;background:var(--sk-ok)}

.sk .prep-row{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:stretch;margin-top:0}
@media(max-width:840px){.sk .prep-row{grid-template-columns:1fr}}
.sk .hero{padding:20px 22px;position:relative;overflow:hidden}
.sk .hero::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--sk-gold)}
.sk .tagrow{display:flex;align-items:center;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.sk .chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:7px;background:var(--sk-surface-2);color:var(--sk-ink-soft)}

.sk .hero h1{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sk .hero .sub{color:var(--sk-ink-soft);font-size:13px;margin-bottom:17px}
.sk .hero .sub b{color:var(--sk-ink);font-weight:600}
.sk .hero .grid{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media(max-width:560px){.sk .hero .grid{grid-template-columns:1fr;gap:16px}}
.sk .count{display:flex;gap:8px}
.sk .count .u{text-align:center;background:var(--sk-surface-2);border-radius:10px;padding:10px 13px;min-width:56px}
.sk .count .n{font-family:var(--sk-mono);font-size:24px;font-weight:700;line-height:1;color:var(--sk-ink)}

.sk .prep-list{display:flex;flex-direction:column;gap:9px}

.sk .prep-list .p i{flex:none;width:18px;height:18px;border-radius:6px;background:var(--sk-gold);color:#fff;

.sk .gc-id b{font-family:var(--sk-mono);color:var(--sk-ink);font-size:12px;font-weight:600}
.sk .gc-id .cpy{border:1px solid var(--sk-line);background:var(--sk-surface-2);color:var(--sk-ink-soft);font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;cursor:pointer}
.sk .gc-list{display:flex;flex-direction:column;gap:8px;flex:1}

.sk .gc-note{font-size:11.5px;color:var(--sk-ink-faint);line-height:1.5}

/* ════════════════════════════════════════════════════════════════
   REDESIGN "STUDIO" (2026-07-26) — lapisan terakhir, menimpa yang di atas.
   Arah: gelap tenang, huruf lapang, satu aksen, angka tetap monospace.
   Ditulis sebagai lapisan penimpa (bukan mengedit 800 baris di atas) supaya
   perubahannya bisa dibaca & dibalik dalam satu blok.
   ════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0f141c; --bg-2:#131a24; --bg-3:#161e29; --bg-4:#1b2331; --bg-term:#0b0f15;
  --bd:#202834; --bd-strong:#2b3545; --bd-soft:#1a2230;
  --fg:#e8ecf3; --fg-mute:#aab3c2; --fg-dim:#8c96a8; --fg-faint:#737d8e;
  --accent:#6b93f2; --accent-soft:#8fb0ff; --gold:#c8a24a;
  --rad:14px; --rad-s:10px;
  --shadow-card:0 1px 2px rgba(0,0,0,.20),0 10px 28px rgba(0,0,0,.24);
  --shadow-soft:0 2px 8px rgba(0,0,0,.28);
}
/* angka, jam, kode → tetap monospace + rata lebar digit */
.num,.mono,.tabular,.clk,.kv b,.stat .sv,.nowhud .bigday,.nowhud .bigclock,
.calcell .dn,.cbmap .cn,.cbmap .tn,.sk .count .n,.sk .pf-clock .clk,
.sk .pf-clock .reset b,.sk .gc-row code,.sk .ev .when,.sk .timeset .cd,
input,select,textarea{font-family:var(--font-num);font-variant-numeric:tabular-nums}
/* .sk memakai tumpukan font sendiri (system-ui) → bentuk huruf beda antar tab */
:root{ --sk-sans:var(--font-ui); --sk-mono:var(--font-num); }

/* ── skala tipe ── */
body{font-size:14px;line-height:1.6;letter-spacing:0}
.pagehead h1{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.pagehead p{font-size:14px;line-height:1.6;color:var(--fg-mute);max-width:68ch}
.card-h h2{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.card-b,.alert,.muted,.check .d,table,.lrow{font-size:14px;line-height:1.6}
.small{font-size:13px}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;color:var(--fg-dim)}
th{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--fg-dim)}
td{padding:11px 10px}
.card-h .meta,.clkmeta,.muted.small{font-size:12.5px;color:var(--fg-dim)}

/* ── komponen ── */
.card{background:var(--bg-2);border:1px solid var(--bd);border-radius:var(--rad);box-shadow:none}
.card-h{padding:13px 16px;border-bottom:1px solid var(--bd)}
.card-b{padding:16px}
.alert{border-radius:var(--rad-s);padding:12px 14px}
.check{padding:10px 12px;border-radius:var(--rad-s)}
.pill,.tag{border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:0;padding:4px 10px}
.stat{background:var(--bg-3);border:1px solid var(--bd);border-radius:12px;padding:12px 16px}
.stat .sv{font-size:25px;font-weight:600;line-height:1.15}
.stat .sl{font-size:10.5px;font-weight:600;letter-spacing:.07em;color:var(--fg-dim)}
.btn{border-radius:var(--rad-s);font-size:13.5px;font-weight:600;letter-spacing:0;text-transform:none}
.seg button{font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;border-radius:999px;padding:8px 14px}
.navbtn{font-size:13.5px;font-weight:500;letter-spacing:0}
.navbtn.active{font-weight:600}
summary{font-size:14px;font-weight:600}
.kv{padding:9px 0;border-bottom:1px solid var(--bd-soft)}

/* ── tahap 2: tab Sekarang (.sk) memakai token yang SAMA ──
   .sk punya set warnanya sendiri (peninggalan mockup terang yang dipaksa gelap),
   jadi permukaan & garisnya sedikit berbeda dari kartu tab lain — terlihat seperti
   dua aplikasi yang ditempel. Di sini token .sk diarahkan ke token Studio. */
.sk{
  --sk-bg:var(--bg); --sk-surface:var(--bg-2); --sk-surface-2:var(--bg-3);
  --sk-line:var(--bd); --sk-ink:var(--fg); --sk-ink-soft:var(--fg-mute);
  --sk-ink-faint:var(--fg-dim); --sk-accent:var(--accent); --sk-r:var(--rad);
  --sk-shadow:none;
  font-size:14px; line-height:1.6; letter-spacing:0;
}
.sk .eyebrow h2,.sk .lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;color:var(--fg-dim)}
.sk .eyebrow{margin:24px 2px 12px}
.sk .eyebrow .hint{font-size:12.5px;font-weight:400;color:var(--fg-dim)}
.sk .card{box-shadow:none}
.sk .gc-head{font-size:15.5px;font-weight:600;letter-spacing:-.01em}

/* ── tahap 3 (visual): ritme baris & jarak antar blok ──
   Baris daftar dulu tanpa pemisah sehingga menyatu jadi satu blok abu-abu. */
.sk .kv.sk-evrow{padding:11px 14px;border-bottom:0;border-top:1px solid var(--bd-soft)}
.sk .sk-evgrid > .kv.sk-evrow:first-child{border-top:0}
.sk .kv.sk-evrow:hover{background:var(--bg-3)}
.card + .card,.lcard + .lcard{margin-top:16px}
.lbl{margin-top:22px;margin-bottom:8px}
.card-b > .alert:first-child{margin-top:0}
details.hogstage > summary{border-radius:var(--rad-s)}

/* ── tahap 4: mengikuti pola situs pendamping game yang matang ──
   Diukur 26 Jul 2026 dengan skrip yang sama di keempat situs:
     maxroll.gg          isi 16px/1,5 · panel radius 16 · latar #0a0a0a
     prydwen.gg          isi 18px/1,8 · judul 30/700
     poe.ninja           isi 14px/1,4 (alat data padat)
     kingshotoptimizer   isi 16px/1,5 · Inter · SIDEBAR berkelompok
   App kita 14px — paling kecil di antara semuanya. Dinaikkan ke 15px (bukan 16,
   karena isi kita lebih padat data daripada situs artikel). */
body,.card-b,.alert,.muted,.check .d,table,.lrow{font-size:15px}
.small,.muted.small{font-size:13.5px}
.pagehead h1{font-size:26px}
.card-h h2{font-size:16px}

/* Sidebar berkelompok di layar lebar — 12 tujuan dalam satu deret datar sulit
   dipindai; situs sejenis memakai rail kiri dengan kelompok. */
@media(min-width:1100px){
  .apphead{position:sticky;top:0;z-index:40}
  /* .apphead memakai backdrop-filter → ia jadi containing block untuk anak yang
     position:fixed, sehingga "bottom:0" mengacu ke tinggi header (44px), bukan
     layar. Karena itu tingginya dihitung eksplisit dari viewport. */
  .topnav{position:fixed;left:0;top:var(--hdr-h,62px);bottom:auto;
    height:calc(100vh - var(--hdr-h,62px));width:236px;
    flex-direction:column;align-items:stretch;gap:2px;padding:16px 12px 28px;
    background:var(--bg-2);border-right:1px solid var(--bd);overflow-y:auto;overflow-x:hidden;
    cursor:default;touch-action:auto}
  .topnav .navbtn{width:100%;justify-content:flex-start;border-radius:10px;padding:9px 12px;margin:0}
  .topnav .navbtn.active{background:rgba(107,147,242,.16);color:var(--accent-soft);
    font-weight:600;box-shadow:none}
  .navgrp{margin-bottom:16px}
  .navgrp-t{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fg-faint);padding:0 12px 7px}
  .content{margin-left:236px;max-width:1120px}
}
/* layar sedang & HP: kembali jadi satu baris seperti sebelumnya */
@media(max-width:1099px){ .navgrp{display:contents} .navgrp-t{display:none} }

/* ════════════════════════════════════════════════════════════════
   STUDIO — LAPIS KOMPONEN (tahap 5)
   Tahap sebelumnya hanya menyentuh token & tipografi, jadi tombol, kolom
   input, alert, tabel, dan kotak stat masih memakai gaya lama: tiga bentuk
   tombol berbeda, alert berbingkai penuh, kotak stat bergaris berat, dan sisa
   hiasan sudut di kartu "hud". Di sini komponennya yang dirombak.
   ════════════════════════════════════════════════════════════════ */

/* hiasan sudut peninggalan tema lama — dimatikan */
.card.hud::before,.card.hud::after{display:none}

/* ── tombol: satu geometri, tiga tingkat kepentingan ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:38px;padding:0 16px;border-radius:10px;border:1px solid transparent;
  background:var(--accent);color:#0a1020;font:600 13.5px/1 var(--font-ui);
  letter-spacing:0;text-transform:none;clip-path:none;box-shadow:none;
  transition:background .14s var(--ease),border-color .14s var(--ease),color .14s var(--ease)}
.btn:hover{background:#7ea4f7;transform:none}
.btn:active{background:#5a83e8}
.btn.sec{background:transparent;color:var(--fg);border-color:var(--bd-strong)}
.btn.sec:hover{background:var(--bg-3);border-color:var(--bd-strong);color:var(--fg)}
.btn.ghost{background:transparent;color:var(--fg-mute);border-color:transparent}
.btn.ghost:hover{background:var(--bg-3);color:var(--fg);border-color:transparent}
.btn.sm{min-height:32px;padding:0 12px;font-size:12.5px}
.btn[disabled],.btn:disabled{opacity:.45;pointer-events:none}

/* ── kolom input: satu bentuk, cincin fokus jelas ── */
input,select,textarea{min-height:38px;padding:8px 12px;border-radius:10px;
  background:var(--bg);border:1px solid var(--bd-strong);color:var(--fg);
  font-size:14px;box-shadow:none;transition:border-color .14s var(--ease),box-shadow .14s var(--ease)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(107,147,242,.20)}
input::placeholder{color:var(--fg-faint)}
label.fl,.fl{font:600 11.5px/1.4 var(--font-ui);letter-spacing:.06em;
  text-transform:uppercase;color:var(--fg-dim)}
input[type=checkbox]{min-height:0;accent-color:var(--accent)}

/* ── alert: batang aksen di kiri, bukan kotak berbingkai penuh ── */
.alert{position:relative;border:0;border-radius:10px;padding:12px 14px 12px 16px;
  margin:10px 0;background:var(--bg-3);color:var(--fg);overflow:hidden}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fg-faint)}
.alert.inf{background:rgba(107,147,242,.08)}   .alert.inf::before{background:var(--accent)}
.alert.ok{background:rgba(55,184,119,.08)}     .alert.ok::before{background:var(--profit)}
.alert.warn{background:rgba(224,161,62,.09)}   .alert.warn::before{background:var(--warn)}
.alert.bad{background:rgba(240,101,74,.09)}    .alert.bad::before{background:var(--loss)}
.alert.bad,.alert.warn,.alert.ok,.alert.inf{color:var(--fg)}

/* ── kotak stat: tanpa garis, cukup permukaan ── */
.stat{background:var(--bg-3);border:0;border-radius:12px;padding:12px 16px}
.stat .sv{font-size:23px;font-weight:600}
.stats{gap:10px}

/* ── tabel: kepala tenang, baris menyala saat disentuh ── */
table{border-collapse:collapse}
th{background:transparent;border-bottom:1px solid var(--bd-strong);padding:9px 10px;
  text-transform:uppercase}
td{border-top:1px solid var(--bd-soft)}
tbody tr:hover td{background:rgba(255,255,255,.022)}
.scrollx{border-radius:10px}

/* ── details: satu bentuk, penanda buka-tutup ── */
details{border:1px solid var(--bd);border-radius:10px;background:transparent;overflow:hidden}
details + details{margin-top:8px}
details > summary{list-style:none;cursor:pointer;padding:11px 14px;font:600 14px/1.4 var(--font-ui);
  display:flex;align-items:center;gap:10px;background:transparent;transition:background .14s var(--ease)}
details > summary::-webkit-details-marker{display:none}
details > summary::before{content:"›";font-size:17px;line-height:1;color:var(--fg-dim);
  transition:transform .16s var(--ease);flex:0 0 auto}
details[open] > summary::before{transform:rotate(90deg)}
details > summary:hover{background:var(--bg-3)}
details > .dt{padding:0 14px 14px}

/* ── baris centang & baris daftar ── */
.check{background:var(--bg-3);border:0;border-radius:10px;padding:11px 13px;margin:6px 0}
.check.note{background:transparent;border-top:1px solid var(--bd-soft);border-radius:0;padding:10px 2px;margin:0}
.check:hover{background:var(--bg-4)}
.check.note:hover{background:transparent}
.kv{border-bottom:1px solid var(--bd-soft);padding:10px 0}

/* ── kedalaman: latar & kartu dulu cuma beda ~4% terang, jadi seluruh layar
   terbaca sebagai satu lembar gelap. Jaraknya dilebarkan supaya kartu benar-benar
   "duduk di atas" halaman, plus bayangan halus. ── */
:root{
  --bg:#0a0e14; --bg-2:#151c27; --bg-3:#1c2532; --bg-4:#232d3d;
  --bd:#232c3a; --bd-strong:#33405430; --bd-soft:#1b232f;
}
body{background:var(--bg)}
.card{background:var(--bg-2);border:1px solid #232c3a;box-shadow:0 1px 2px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.22)}
.card-h{background:transparent;border-bottom:1px solid #232c3a}
input,select,textarea{background:#0c1219;border-color:#2b3646}
.topnav{background:#0c1119;border-right-color:#1e2735}
.apphead{background:rgba(10,14,20,.92)}
.stat{background:var(--bg-3)}
.btn{color:#f2f6ff}
.btn:hover{color:#fff}
.mobnav{background:rgba(10,14,20,.97);border-top-color:#1e2735}
.navsheet-p{background:var(--bg-2)}
.sk .card{box-shadow:0 1px 2px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.22)}
</style>

 ~day 3-4","saat migrasi/All-Out":"during migration/All-Out","24 jam (setelah event besar)":"24 hours (after major event)","Alliance Tech (riset aliansi)":"Alliance Tech (alliance research)","fitur · aliansi":"feature · alliance","~hari server 365":"~server day 365","Fitur baru relevan: daily mission khusus Mystic Trial; Rebel Invasion quick-battle (unlock TC25); 2 slot formasi tambahan (TC26 & TC30) + bisa menamai formasi (3 huruf); tukar (exchange) material gear/charm berlebih di interface gear.":"Relevant new features: daily mission specific to Mystic Trial; Rebel Invasion quick-battle (unlocks TC25); 2 extra formation slots (TC26 & TC30) + can name formations (3 letters); exchange excess gear/charm materials in the gear interface.","permanen (gate Kingdom Progress · TC25 / ~Hari 113)":"permanent (gated by Kingdom Progress · TC25 / ~Day 113)","Poin dari rekrut/naikkan hero. F2P: klaim recruitment gratis; pakai shard yang memang sudah direncanakan. JANGAN spend gem khusus event ini — gem paling bernilai di Hero Roulette saat HoG D2 (90.000/spin).":"Points from recruiting/leveling up heroes. F2P: claim free recruitment; use shards you already planned to use. DON'T spend gems specifically for this event — gems are worth most in Hero Roulette on HoG D2 (90,000/spin).","Sub-event harian: poin dari mulai/selesaikan riset. Mulai riset SETELAH reset biar kehitung; barengkan riset besar dengan hari riset HoG/SG/KvK biar poinnya dobel.":"Daily sub-event: points from starting/finishing research. Start research AFTER the reset so it counts; time big research to overlap with HoG/SG/KvK research day so points double up.","Hero Gear (per-hero) MAKS — Pet/Charm/Governor Gear/Academy DIABAIKAN. Leader = hero terkuat & paling banyak gear-nya.":"Hero Gear (per-hero) MAXED — Pet/Charm/Governor Gear/Academy IGNORED. Leader = your strongest hero with the most gear.","🤝 JOINER (F2P pilih ini)":"🤝 JOINER (F2P pick this)","Counter musuh (RPS) — kirim troop terkuat":"Counter the enemy (RPS) — send your strongest troop","Butuh Command Center + Attack Widget (P2W) — jarang worth F2P":"Needs Command Center + Attack Widget (P2W) — rarely worth it for F2P","Jadwal per hari":"Daily schedule","🔒 TAHAN: speedup (utk D1/D5/D7), Mithril (D2/D4/D5), Advanced Taming Mark (D3), troop T9 + Training Capacity buff (D4/D6), gem":"🔒 HOLD: speedups (for D1/D5/D7), Mithril (D2/D4/D5), Advanced Taming Mark (D3), T9 troops + Training Capacity buff (D4/D6), gems","★ SPIN Hero Roulette (+90.000/spin!) pakai GEM/KUNCI + shard (Mythic 35rb/Epic 14rb/Rare 4rb)":"★ SPIN Hero Roulette (+90,000/spin!) using GEMS/KEYS + shards (Mythic 35k/Epic 14k/Rare 4k)","Latih/promote troop tier TERTINGGI (Lv10=1.960 vs Lv1=90) + Training Capacity buff":"Train/promote your HIGHEST tier troops (Lv10=1,960 vs Lv1=90) + Training Capacity buff","Naikkan Governor Charm (+1.000/score, level awal lompat besar)":"Level up Governor Charm (+1,000/score, early levels jump big)","Naikkan Governor Gear (+500/score; Mythic level-up 6.250)":"Level up Governor Gear (+500/score; Mythic level-up 6,250)","🔒 TAHAN: gem + Widget (utk D2 & D5 = 90rb & 100rb!), troop T9 + Training Capacity buff (D3), Charm design (D4), Forgehammer (D5), speedup (D7)":"🔒 HOLD: gems + Widget (for D2 & D5 = 90k & 100k!), T9 troops + Training Capacity buff (D3), Charm design (D4), Forgehammer (D5), speedups (D7)","⛔ JANGAN buang speedup di Armament (1 poin/menit) — KvK = 30/mnt (lihat tabel di atas). Simpan bank speedup untuk KvK/SG.":"⛔ DON'T waste speedups on Armament (1 point/min) — KvK = 30/min (see table above). Bank your speedups for KvK/SG.","Serang TURRET bukan castle — tiap turret musuh = 2% korban/siklus ke garrison (4 turret = 8%, tak bisa di-heal). Rebut 4 turret = aliansi menengah bisa tahan lawan yang lebih kuat.":"Attack the TURRET, not the castle — each enemy turret = 2% casualties/cycle to the garrison (4 turrets = 8%, cannot be healed). Capturing 4 turrets lets a mid-tier alliance hold against a stronger enemy.","Rebut ULANG turret musuh untuk \"reset\" — attack-speed turret naik makin lama dipegang; 1 retake mematahkannya & beri waktu garrison heal.":"RETAKE the enemy turret to \"reset\" it — turret attack-speed rises the longer it's held; 1 retake breaks that and gives the garrison time to heal.","Castle menang by TOTAL WAKTU tahan (dihitung per-ALIANSI), bukan 1 timer — 90 menit kalah dari 2 jam; jangan pecah hold antar aliansi.":"Castle is won by TOTAL hold TIME (counted per ALLIANCE), not a single timer — 90 minutes loses to 2 hours; don't split holds across alliances.","Heal pakai slider ~30 menit + spam Help (BUKAN speedup) — heal nyaris terus-menerus, 0 speedup. Speedup heal hanya saat hospital overflow.":"Heal using the ~30-minute slider + spam Help (NOT speedups) — near-continuous healing, 0 speedups. Only speed up healing when the hospital overflows.","Pet unlock by UMUR SERVER (bukan TC/spend) — whale Day-50 mustahil punya Lion; F2P Day-200 punya semua. Equalizer F2P terbesar.":"Pets unlock by SERVER AGE (not TC/spend) — a Day-50 whale can't possibly have Lion; F2P Day-200 has them all. The biggest F2P equalizer.","JANGAN buang pet food ke Gen-1 (Gray Wolf/Bison/Lynx) — food sama di Lion (~Day 113) ~3x stat. Gen-1 cukup fungsional, sisanya TABUNG.":"DON'T waste pet food on Gen-1 (Gray Wolf/Bison/Lynx) — the same food on Lion (~Day 113) gives ~3x the stats. Gen-1 is functional enough, STOCKPILE the rest.","Rencanakan 1 pet ke depan — pet bagus di-gate level pet sebelumnya (Lion butuh Moose Lv15; Mighty Bison butuh Giant Rhino Lv30).":"Plan 1 pet ahead — good pets are gated by the previous pet's level (Lion needs Moose Lv15; Mighty Bison needs Giant Rhino Lv30).","Master Academy: UNLOCK master lebih awal, ADVANCE belakangan. Pan = pilihan F2P pertama (ekonomi harian, tak perlu jadi rally lead).":"Master Academy: UNLOCK masters early, ADVANCE them later. Pan = first F2P pick (daily economy, no need to be rally lead).","Master/Journey supply 40 gratis/hari (jam UTC tetap: 00:00 +20, 08:00 +10, 16:00 +10) — jangan overflow, hangus permanen.":"Master/Journey supply gives 40 free/day (fixed UTC times: 00:00 +20, 08:00 +10, 16:00 +10) — don't overflow, it's permanently lost.","Event build/riset skor by POWER NAIK, bukan lama speedup — 1 upgrade tier tinggi > banyak kecil.":"Build/research events score by POWER GAINED, not speedup duration — 1 high-tier upgrade > many small ones.","Pre-antri upgrade TC TERBESAR ke ~99% SEBELUM event, selesaikan DI window = lonjakan poin.":"Pre-queue your BIGGEST TC upgrade to ~99% BEFORE the event, finish it WITHIN the window = a points spike.","PROMOTE troop (bukan train baru) saat event training — poin per jam-speedup lebih besar. Masuk hari training dgn army 1 tier di bawah max.":"PROMOTE troops (not train new ones) during training events — more points per speedup-hour. Enter the training day with your army 1 tier below max.","Edict combo: nyalakan \"Productivity Day\" (x2 produksi) DULU, baru \"Rush Job\" (instan 5 hari) = ~10 hari resource sekali klik.":"Edict combo: activate \"Productivity Day\" (x2 production) FIRST, then \"Rush Job\" (instant 5 days) = ~10 days of resources in one click.","Bear Hunt ABAIKAN semua stat defensif (def/HP) — beruang tak balas. Cuma Attack & Lethality berlaku, jadi defense = sia-sia di sini.":"Bear Hunt: IGNORE all defensive stats (def/HP) — the bear doesn't fight back. Only Attack & Lethality apply, so defense is wasted here.","Pompa Lethality > Attack — kebanyakan over-invest Attack, jadi Lethality multiplier-nya lebih rendah = ROI lebih tinggi.":"Pump Lethality > Attack — most people over-invest in Attack, so Lethality's multiplier is lower = higher ROI.","Joiner cuma sumbang skill Expedition #1 hero pertama + troop mentah — joiner skill bagus SETARA whale joiner; ukuran akun joiner nyaris tak penting.":"Joiners only contribute their #1 hero's Expedition skill + raw troops — a good joiner skill is EQUAL to a whale joiner; joiner account size barely matters.","Joiner Lethality (Chenko/Amadeus/Yeonwoo +25% flat) ADITIF & menumpuk (4 Chenko compound). Game cuma pakai 4 skill joiner tertinggi/rally — koordinasi 4 slot teratas jadi Lethality.":"Joiner Lethality (Chenko/Amadeus/Yeonwoo +25% flat) is ADDITIVE & stacks (4 Chenko compound). The game only uses the top 4 joiner skills/rally — coordinate the top 4 slots into Lethality.","Kirim joiner SALAH lebih buruk dari tanpa hero — skill defensif/ekonomi (Diana/Gordon/Jabel) blokir slot. Kalau tak ada hero Lethality, kirim troop-only.":"Sending the WRONG joiner is worse than sending no hero — defensive/economy skills (Diana/Gordon/Jabel) block the slot. If you have no Lethality hero, send troop-only.","🤝 Aliansi / disiplin troop":"🤝 Alliance / troop discipline","Rally lebih SEDIKIT tapi PENUH > banyak tipis — tiap rally pecah pool joiner; 3 rally x5 joiner >> 5 rally x3. Suruh R4/R5 batasi jumlah rally vs anggota aktif.":"FEWER but FULL rallies > many thin ones — every rally splits the joiner pool; 3 rallies x5 joiners >> 5 rallies x3. Have R4/R5 limit the number of rallies vs active members.","1 pengecualian gem selain Roulette: sewa builder ke-2 (1.000 gem/2 hari) saat build besar — clear Saul 2-bintang dulu (~6% speed konstruksi permanen).":"1 gem exception besides Roulette: rent the 2nd builder (1,000 gems/2 days) during big builds — clear Saul to 2-stars first (~6% permanent construction speed).","Mulai FARM ACCOUNT sebelum tembok TC28-30 (bracket rakus resource) — stok farm bikin mulus + suplai main saat KvK.":"Start FARM ACCOUNTS before hitting the TC28-30 wall (a resource-hungry bracket) — farm stockpiles smooth things out + supply your main during KvK.","~18 hari":"~18 days","Murah & penting — kapasitas wounded. JANGAN cap Lv10 — jaga ~1 level di bawah TC (juga prasyarat upgrade TC).":"Cheap & important — wounded capacity. DON'T cap at Lv10 — keep it ~1 level below TC (also a TC upgrade prerequisite).","Wall 20 + Academy 19 + semua militer 19":"Wall 20 + Academy 19 + all military 19","War Academy (buka Age of Truegold ~hari 70); riset T11 di umur ~220 + TC30":"War Academy (unlocks Age of Truegold ~day 70); research T11 at ~age 220 + TC30","TC27+ (Truegold lanjutan; timing pasti verif in-game). Semua tipe ke T11 DULU baru push 1 ke T12":"TC27+ (further Truegold; exact timing verify in-game). Get ALL types to T11 FIRST before pushing 1 to T12","• Promote naik (T9→T10→T11) > train massal tier rendah — lebih banyak poin event per speedup. TAPI di tier rendah VOLUME menang (banyak T9 > sedikit T10) — bangun volume dulu, promote saat event skor.":"• Promoting up (T9→T10→T11) > mass-training low tier — more event points per speedup. BUT at low tier VOLUME wins (lots of T9 > few T10) — build volume first, promote during scoring events.","• Floor 5.000 infantry di formasi rally (trigger skill hero infantry). Rasio default (seimbang / musuh tak diketahui) = 50/20/30 — rasio per situasi lihat tabel Formasi.":"• Floor of 5,000 infantry in rally formations (triggers infantry hero skills). Default ratio (balanced / unknown enemy) = 50/20/30 — see the Formation table for situational ratios.","🏛️ Prioritas Gubernur — item yang dinaikkan":"🏛️ Governor Priority — items to upgrade","— rush ke TC30 (buka T10 + Age of Truegold). Semua di-gate level TC; jangan biarkan antrian bangun kosong.":"— rush to TC30 (unlocks T10 + Age of Truegold). Everything is gated by TC level; don't leave the build queue empty.","SELURUH pasukan":"ALL troops","A. GOVERNOR GEAR — 6 item (beri Attack + Defense)":"A. GOVERNOR GEAR — 6 items (gives Attack + Defense)",", lalu":", then","(bottleneck, mulai tier Blue 2★). Naikkan berurutan:":"(bottleneck, starting at Blue 2★ tier). Upgrade in order:","Untuk":"For","→ naikkan ke-6 berbarengan 1 tier. Trik F2P: dorong 3 item dulu (Cloak + Breeches + Ring) ke Purple untuk jaga set bonus saat Artisan's Vision seret.":"→ level all 6 together by 1 tier. F2P trick: push 3 items first (Cloak + Breeches + Ring) to Purple to keep the set bonus while Artisan's Vision is scarce.","B. GOVERNOR CHARM — 3 jenis (beri Lethality + Health, lebih impactful)":"B. GOVERNOR CHARM — 3 types (gives Lethality + Health, more impactful)","(beli di Mystic Trial / Alliance Brawl shop). Pasang charm di tiap item gear dulu, lalu naikkan berurutan:":"(bought from the Mystic Trial / Alliance Brawl shop). Socket a charm into each gear item first, then upgrade in order:","(lebih hemat 60 Guide drpd sebar 3 charm L3→L4). Urut: Protection → Vision → Keenness, ulang.":"(saves 60 Guides vs spreading 3 charms L3→L4). Order: Protection → Vision → Keenness, repeat.","Gear/Charm (Satin/Gilded/Artisan + Charm Design) — BEDA dari":"Gear/Charm (Satin/Gilded/Artisan + Charm Design) — DIFFERENT from","Gear (Forgehammer/Mithril, cuma saat hero-mu MEMIMPIN — termasuk Mystic Trial/Arena, bukan saat join rally). Nama item dari wiki — cek nama persis di layar Avatar → Governor → Gear.":"Gear (Forgehammer/Mithril, only when your hero is LEADING — includes Mystic Trial/Arena, not when joining a rally). Item names are from the wiki — check the exact name on the Avatar → Governor → Gear screen.","Gear hero aktif saat hero-mu":"Hero Gear is active when your hero","march — rally leader, garrison, DAN expedition solo (":"marches — rally leader, garrison, AND solo expedition (","SIA-SIA hanya saat JOIN rally orang lain":"WASTED only when JOINING someone else's rally","(cuma gear si leader yang dihitung). Fokus 3 hero leader (1 Inf + 1 Cav + 1 Archer); untuk stage dalam Mystic Trial, taruh gear SISA (jangan Forgehammer) di hero ke-4/5.":"(only the leader's gear counts). Focus on 3 leader heroes (1 Inf + 1 Cav + 1 Archer); for stages within Mystic Trial, put LEFTOVER gear (not Forgehammer) on your 4th/5th hero.","(Slot gear hero cuma 4: Helmet/Chest/Gloves/Boots — tak ada \"Belt\".)":"(Hero gear only has 4 slots: Helmet/Chest/Gloves/Boots — there's no \"Belt\".)","gear bisa dipindah antar-hero, tapi dalam tipe yang sama. 1 set Infantry → hero infantry terbaikmu (Howard→Zoe); 1 set Cavalry → Jabel→Petra; 1 set Archer → Marlin. Gear Cavalry TIDAK nyambung ke hero Infantry.":"gear can be moved between heroes, but only within the same type. 1 Infantry set → your best infantry hero (Howard→Zoe); 1 Cavalry set → Jabel→Petra; 1 Archer set → Marlin. Cavalry gear does NOT carry over to Infantry heroes.","Ursa’s Rage: kurangi Squad Defense musuh (% verif in-game)":"Ursa's Rage: reduces enemy Squad Defense (% verify in-game)","Event PERTUMBUHAN berbasis umur server (HoG · KvK · SG · Burst · Milestone) + event mingguan aliansi (rotasi live kingshot.net). Klik tanggal untuk detail.":"GROWTH events based on server age (HoG · KvK · SG · Burst · Milestone) + weekly alliance events (live rotation on kingshot.net). Click the date for details.","= kekuatan serang;":"= attack power;","= daya tahan. Isi total bonus %-mu (Avatar → Stat / detail troop) untuk lihat keseimbangan & stat mana yang jadi prioritas.":"= staying power. Enter your total bonus % (Avatar → Stat / troop detail) to see the balance & which stat to prioritize.","Indeks Serang":"Attack Index","Indeks Tahan":"Defense Index","Prioritas naikkan":"Priority to upgrade","Indeks = pengali relatif dari buff-mu (bukan angka power in-game). Gunanya lihat keseimbangan serang↔tahan dan stat terlemah untuk dinaikkan lebih dulu.":"Index = a relative multiplier from your buffs (not the in-game power number). Use it to see the attack↔defense balance and which stat is weakest to upgrade first.",". Pilih tipe pasukan dominan musuh (dari Battle Report) → rasio counter Inf/Archer/Cav.":". Pick the enemy's dominant troop type (from Battle Report) → counter ratio Inf/Archer/Cav.","Inf / Archer / Cav — seimbang / musuh tak diketahui":"Inf / Archer / Cav — balanced / unknown enemy","(Infantry + Archer, tanpa Cavalry) — infantry tembok, archer DPS. Jaga floor":"(Infantry + Archer, no Cavalry) — infantry as wall, archer DPS. Keep the floor","supaya skill hero infantry aktif. Default (musuh tak diketahui) = 50/20/30.":"so infantry hero skills stay active. Default (unknown enemy) = 50/20/30.","Hitung waktu upgrade sebenarnya setelah bonus":"Calculate the actual upgrade time after bonuses",", dan berapa speedup yang dibutuhkan. Baca":", and how many speedups are needed. Read","di layar upgrade dan total":"on the upgrade screen and the total","💡 Simpan upgrade besar untuk hari":"💡 Save big upgrades for the day","SEBELUM mulai (window 5 mnt).":"BEFORE starting (5 min window).","Rumus: Double Time diterapkan ke base dulu (×0.5), lalu Construction Speed menumpuk (÷ (1 + %/100)) — sesuai mekanik in-game, bukan stack flat.":"Formula: Double Time is applied to the base first (×0.5), then Construction Speed stacks (÷ (1 + %/100)) — matching in-game mechanics, not flat stacking.","Tambah Player ID":"Add Player ID","＋ Tambah":"＋ Add","Jam diisi dalam zona":"Times are entered in the zone","(ikut toggle WIB/... di kanan atas). Ganti toggle = jam ikut dikonversi otomatis.":"(follows the WIB/... toggle at the top right). Switching the toggle converts the times automatically.","— tiap hari · WIB":"— every day · WIB","— Tiap 2 minggu (~30mnt; jam diatur aliansi) · WIB":"— Every 2 weeks (~30min; time set by alliance) · WIB","Stage 10 (tembok):":"Stage 10 (wall):","Mithril + buang speedup":"Mithril + burn speedups","Shard hero sisa + buang speedup (300/mnt Constr/Research/Train)":"Leftover hero shards + burn speedups (300/min Constr/Research/Train)","⭐ Trik hemat: lompat":"⭐ Money-saving trick: jump","= hari ke-2). Garis biru bawah = ada event mingguan kingdom hari itu.":"= day 2). A blue underline = a weekly kingdom event on that day.","🦸 Bangun Petra (Gen 3) via Roulette; dorong Zoe ke 4★ + widget.":"🦸 Build Petra (Gen 3) via Roulette; push Zoe to 4★ + widget.","PACK uang asli berisi research speedup/resource — BUKAN kompetisi poin riset. F2P: SKIP pack; tahan riset & dump di hari scoring riset (HoG/SG D5) untuk poin event yang SEBENARNYA. Trap: mengira \"Tech Storm\" itu event scoring lalu riset di waktu salah.":"Real-money PACK of research speedups/resources — NOT a research-point competition. F2P: SKIP the pack; hold research & dump it on a research-scoring day (HoG/SG D5) for the REAL event points. Trap: thinking \"Tech Storm\" is a scoring event and researching at the wrong time.","PACK uang asli berisi Advanced Teleporter + healing speedup (muncul saat event migrasi/relokasi). F2P: SKIP kecuali kamu memang sedang relokasi state & butuh Advanced Teleporter. Trap: di-drop pas event bikin \"butuh teleporter sekarang\" = FOMO rekayasa.":"Real-money PACK with an Advanced Teleporter + healing speedups (appears during migration/relocation events). F2P: SKIP unless you're actually relocating states & need the Advanced Teleporter. Trap: dropped during an event to manufacture \"I need a teleporter now\" FOMO.","Academy + War Academy (riset)":"Academy + War Academy (research)","Selesaikan upgrade/riset/promote troop naik power (Constr/Research 30, troop 20).":"Finish an upgrade/research/troop promotion to raise power (Constr/Research 30, troop 20).","Sedang berjalan":"Running now","Berikutnya":"Up next","Jadwal tidak pasti":"Schedule unknown","tak bisa diprediksi":"cannot be predicted","⚠ Event musiman tidak terlihat di sini":"⚠ Seasonal events are invisible here","Kingshot menjalankan event terbatas yang tidak ada di katalog maupun API mana pun — contoh: Football Fiesta (9–16 Juli 2026, city skin permanen Apex Arena). Hanya berita in-game & Discord resmi yang mengumumkannya. Daftar di atas lengkap untuk event BERULANG; untuk yang musiman, matamu sendiri satu-satunya sumber.":"Kingshot runs limited-time events that appear in no catalogue or API — e.g. Football Fiesta (9–16 Jul 2026, permanent Apex Arena city skin). Only in-game news and the official Discord announce them. The list above is complete for RECURRING events; for seasonal ones, your own eyes are the only source.","Discord resmi Kingshot":"Official Kingshot Discord","📌 Hitungan umur
