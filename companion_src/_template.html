<style>/* ============================================================
   KINGSHOT COMPANION — ALPHA13 tactical HUD theme
   ============================================================ */
:root{
  --bg:#0B0E13; --bg-2:#11151E; --bg-3:#161B26; --bg-4:#1C2230; --bg-term:#06080C;
  --bd:rgba(255,255,255,.06); --bd-strong:rgba(255,255,255,.14); --bd-soft:rgba(255,255,255,.04);
  --fg:#ECEFF4; --fg-mute:#9AA4B8; --fg-dim:#7A86A0; --fg-faint:#3F4555;
  --accent:#E8FF3A; --accent-dim:#BDD32E; --cyan:#00F0FF; --pink:#FF2D6F;
  --profit:#00E5A0; --warn:#FFB454; --loss:#FF4655;
  --font-ui:"Inter","Helvetica Neue",-apple-system,system-ui,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow-card:0 4px 16px rgba(0,0,0,.4);
  --glow:0 0 24px rgba(232,255,58,.28);
  --offset:6px 6px 0 rgba(0,240,255,.16);
  --scan:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px);
  --rtl:radial-gradient(ellipse 70% 50% at 18% 12%,rgba(232,255,58,.045),transparent 60%);
  --rbr:radial-gradient(ellipse 55% 45% at 85% 90%,rgba(0,240,255,.035),transparent 60%);
  --ease:cubic-bezier(.4,0,.2,1);
  --side:218px;
  --rad:8px; --rad-s:5px;
  --shadow-soft:0 3px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:var(--scan),var(--rtl),var(--rbr);}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
a{color:var(--cyan);text-decoration:none}
::selection{background:rgba(232,255,58,.25)}

/* tactical label */
.lbl{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--fg-dim)}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh;position:relative;z-index:1}
/* ---- Sidebar (desktop) ---- */
.side{position:fixed;top:0;left:0;bottom:0;width:var(--side);z-index:40;
  background:linear-gradient(180deg,#0c1017,#090c11);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;padding:0}
.side .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--bd)}
.side .brand .a{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--accent);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(232,255,58,.4);background:rgba(232,255,58,.06);box-shadow:var(--glow);flex:0 0 auto}
.side .brand .wm{font-weight:700;font-size:15px;letter-spacing:.04em;line-height:1.1}
.side .brand .wm small{display:block;font-family:var(--font-mono);font-size:9px;font-weight:600;
  letter-spacing:.14em;color:var(--fg-dim);text-transform:uppercase;margin-top:2px}
.navlist{flex:1;overflow-y:auto;padding:10px 8px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin:2px 0;
  background:transparent;border:0;border-left:2px solid transparent;color:var(--fg-mute);
  font-family:var(--font-ui);font-size:13px;font-weight:600;cursor:pointer;transition:.12s var(--ease);
  text-align:left;letter-spacing:.01em}
.navbtn .gi{font-family:var(--font-mono);font-size:16px;width:20px;text-align:center;flex:0 0 auto}
.navbtn:hover{background:var(--bg-3);color:var(--fg)}
.navbtn.active{background:linear-gradient(90deg,rgba(232,255,58,.1),transparent);
  border-left-color:var(--accent);color:var(--accent)}
.side .sidefoot{padding:12px 14px;border-top:1px solid var(--bd);font-family:var(--font-mono);
  font-size:9px;color:var(--fg-faint);letter-spacing:.08em;line-height:1.6}

/* ---- Topbar ---- */
.main{flex:1;margin-left:var(--side);display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:9px 22px;background:rgba(9,12,17,.8);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--bd);min-height:50px}
.clockwrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.clk{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--fg);letter-spacing:.02em}
.clk .wib{font-size:10px;color:var(--fg-dim);font-weight:600}
.clk .nosync{color:var(--warn)}
.clkmeta{font-family:var(--font-mono);font-size:11px;color:var(--fg-mute);letter-spacing:.04em}
.clkmeta b{color:var(--accent)}
.clkmeta .hot{color:var(--warn)}
.tb-spacer{flex:1}
.engine{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;
  background:rgba(232,255,58,.08);color:var(--accent);border:1px solid rgba(232,255,58,.3);
  font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.engine::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:pulse 2s var(--ease) infinite}
.engine.off{color:var(--fg-dim);border-color:var(--bd-strong);background:transparent}
.engine.off::before{background:var(--fg-dim);animation:none}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  background:var(--bg-card,#11151E);border:1px solid var(--bd);color:var(--fg-mute);cursor:pointer;
  font-family:var(--font-mono);font-size:15px;transition:.12s var(--ease)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}

.content{padding:22px;max-width:1080px;margin:0 auto;width:100%}
.tab{display:none}
.tab.active{display:block;animation:fade .28s var(--ease) both}
@keyframes fade{from{transform:translateY(7px)}to{transform:none}}
.pagehead{margin:2px 0 18px}
.pagehead h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.pagehead p{color:var(--fg-mute);font-size:13px;margin:5px 0 0;max-width:62ch}

/* ============ CARD ============ */
.card{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(17,21,30,.92),rgba(11,14,19,.96));
  border:1px solid var(--bd);border-radius:var(--rad);box-shadow:var(--shadow-card);margin-bottom:16px}
.card.hud::before,.card.hud::after{content:"";position:absolute;width:13px;height:13px;
  border-color:var(--accent);border-style:solid;z-index:2}
.card.hud::before{top:0;left:0;border-width:1px 0 0 1px}
.card.hud::after{bottom:0;right:0;border-width:0 1px 1px 0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--bd)}
.card-h h2{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;margin:0;letter-spacing:.01em}
.card-h h2 .gi{font-family:var(--font-mono);color:var(--accent);font-size:15px}
.card-h .meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);letter-spacing:.06em}
.card-b{padding:15px 16px}
.card-b>p:first-child{margin-top:0}
.card-b h3{font-size:11px;font-weight:700;font-family:var(--font-mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);margin:18px 0 9px}
.card-b h3:first-child{margin-top:0}
.muted{color:var(--fg-mute);font-size:12px}
.small{font-size:11.5px}
.dim{color:var(--fg-dim)}

/* ============ HERO / NOW HUD ============ */
.nowhud{position:relative;overflow:hidden;border:1px solid rgba(232,255,58,.22);
  background:linear-gradient(135deg,rgba(232,255,58,.07),rgba(17,21,30,.9) 45%,rgba(11,14,19,.96));
  box-shadow:var(--offset);padding:20px;margin-bottom:18px}
.nowhud .wmk{position:absolute;right:-12px;top:-26px;font-size:120px;font-weight:700;line-height:1;
  color:rgba(255,255,255,.025);font-family:var(--font-ui);letter-spacing:-.05em;pointer-events:none;z-index:0}
.nowhud .corner{position:absolute;width:14px;height:14px;border:1px solid var(--cyan);opacity:.5;z-index:2}
.nowhud .c1{top:8px;left:8px;border-right:0;border-bottom:0}
.nowhud .c2{bottom:8px;right:8px;border-left:0;border-top:0}
.nowhud .inner{position:relative;z-index:1}
.nowhud .dayrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.nowhud .bigday{font-family:var(--font-mono);font-size:42px;font-weight:700;color:var(--accent);
  line-height:.95;letter-spacing:-.01em}
.nowhud .bigday small{font-size:15px;color:var(--fg-mute);font-weight:600;margin-left:4px}
.nowhud .bigclock{font-family:var(--font-mono);font-size:30px;font-weight:700;line-height:1;letter-spacing:.02em}
.nowhud .resetline{font-family:var(--font-mono);font-size:12px;color:var(--fg-mute);margin-top:10px}
.nowhud .resetline b{color:var(--cyan)}

/* ============ STAT GRID ============ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{position:relative;background:linear-gradient(180deg,rgba(17,21,30,.92),rgba(11,14,19,.96));
  border:1px solid var(--bd);border-left:2px solid var(--bd-strong);padding:13px 14px;display:flex;flex-direction:column;gap:5px}
.stat.ok{border-left-color:var(--profit)}.stat.warn{border-left-color:var(--warn)}
.stat.crit{border-left-color:var(--loss)}.stat.acc{border-left-color:var(--accent)}
.stat .sl{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fg-dim)}
.stat .sv{font-family:var(--font-mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);line-height:1}
.stat .sv.sm{font-size:16px}
.stat .ss{font-family:var(--font-mono);font-size:10px;color:var(--fg-mute);line-height:1.3}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:var(--accent);color:#0B0E13;
  font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:0;cursor:pointer;transition:.14s var(--ease);
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.btn:hover{background:var(--accent-dim);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.sec{background:var(--bg-2);color:var(--fg);border:1px solid var(--bd-strong);clip-path:none;
  letter-spacing:.04em;text-transform:none;font-weight:600}
.btn.sec:hover{background:var(--bg-3);border-color:var(--accent);transform:none}
.btn.ghost{background:transparent;color:var(--cyan);border:1px solid var(--bd);clip-path:none;
  letter-spacing:.04em;text-transform:none;font-weight:600;padding:7px 12px;font-size:11.5px}
.btn.ghost:hover{border-color:var(--cyan);background:rgba(0,240,255,.06);transform:none}
.btn.sm{padding:6px 12px;font-size:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ============ INPUTS ============ */
label.fl{display:block;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fg-dim);margin:14px 0 6px}
input,select{width:100%;padding:11px 12px;background:var(--bg-term);border:1px solid var(--bd-strong);
  color:var(--fg);font-family:var(--font-mono);font-size:14px;outline:0;transition:.14s var(--ease);border-radius:0}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============ PILLS ============ */
.pill{display:inline-flex;align-items:center;padding:3px 8px;border:1px solid var(--bd);
  font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.pill.f2p{background:rgba(0,229,160,.15);color:var(--profit);border-color:rgba(0,229,160,.4)}
.pill.warn{background:rgba(255,180,84,.15);color:var(--warn);border-color:rgba(255,180,84,.4)}
.pill.crit{background:rgba(255,70,85,.2);color:var(--loss);border-color:rgba(255,70,85,.5)}
.pill.info{background:rgba(0,240,255,.12);color:var(--cyan);border-color:rgba(0,240,255,.35)}
.pill.s{background:rgba(232,255,58,.16);color:var(--accent);border-color:rgba(232,255,58,.4)}
.pill.a{background:rgba(0,240,255,.12);color:var(--cyan);border-color:rgba(0,240,255,.3)}
.pill.b{background:rgba(138,147,166,.13);color:var(--fg-mute);border-color:var(--bd-strong)}
.pill.c{background:rgba(92,100,120,.12);color:var(--fg-dim);border-color:var(--bd)}
.pill.gen6{background:rgba(255,45,111,.14);color:var(--pink);border-color:rgba(255,45,111,.35)}
.tag{display:inline-flex;align-items:center;background:var(--bg-2);border:1px solid var(--bd);color:var(--fg-mute);
  padding:3px 8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;margin:2px 3px 0 0}

/* ============ ALERTS ============ */
.alert{padding:10px 13px;margin:9px 0;font-size:12.5px;line-height:1.5;border:1px solid;border-left-width:2px}
.alert.ok{background:rgba(0,229,160,.07);border-color:rgba(0,229,160,.4);color:#9af0d2}
.alert.warn{background:rgba(255,180,84,.07);border-color:rgba(255,180,84,.4);color:#ffd9a6}
.alert.bad{background:rgba(255,70,85,.07);border-color:rgba(255,70,85,.45);color:#ffb3ba}
.alert.inf{background:rgba(0,240,255,.06);border-color:rgba(0,240,255,.35);color:#a9e9f2}
.alert b{font-weight:700}

/* ============ CHECK ROWS ============ */
.check{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border:1px solid var(--bd);
  margin:7px 0;background:var(--bg-2);transition:.12s var(--ease)}
.check:hover{border-color:var(--bd-strong)}
.check input[type=checkbox]{width:18px;height:18px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--accent);cursor:pointer}
.check.done{opacity:.45}
.check.done .t{text-decoration:line-through}
.check .t{font-weight:600;font-size:13px}
.check .d{font-size:11.5px;color:var(--fg-mute);margin-top:2px}
.check.note{cursor:default}

/* ============ FOCUS CARDS (now) ============ */
.fcard{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--bd);
  background:var(--bg-2);margin:8px 0;cursor:pointer;transition:.12s var(--ease)}
.fcard:hover{border-color:var(--accent);background:var(--bg-3)}
.fcard .fi{font-family:var(--font-mono);font-size:18px;color:var(--accent);width:22px;text-align:center;flex:0 0 auto}
.fcard .ft{font-weight:700;font-size:13px}
.fcard .fd{font-size:11.5px;color:var(--fg-mute);margin-top:2px;line-height:1.4}
.fcard .fg{margin-left:auto;color:var(--fg-dim);font-family:var(--font-mono);flex:0 0 auto}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:4px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:15px 8px;border:1px solid var(--bd);
  background:var(--bg-2);cursor:pointer;transition:.12s var(--ease);color:var(--fg)}
.qbtn:hover{border-color:var(--accent);background:var(--bg-3)}
.qbtn .qi{font-family:var(--font-mono);font-size:22px;color:var(--accent)}
.qbtn .ql{font-size:11px;font-weight:700;text-align:center}

/* ============ KV / TABLE ============ */
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--fg-mute)}
.kv b{color:var(--fg);text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.kv b.acc{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);border-bottom:1px solid var(--bd-strong)}
tr:nth-child(even) td{background:rgba(255,255,255,.012)}
td b{font-weight:700}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* narrow screens: tighter cells + keep pills/day-ranges on one line */
@media(max-width:480px){
  th,td{padding:7px 6px}
  table{font-size:12px}
  td .pill,td.num{white-space:nowrap}
  /* button rows (mode/situation pickers): wrap instead of off-screen horizontal scroll */
  .seg{flex-wrap:wrap;overflow-x:visible}
}

/* ============ LINEUP CARD ============ */

.rbar{display:flex;height:22px;overflow:hidden;border:1px solid var(--bd);font-family:var(--font-mono);
  font-size:10px;font-weight:700;color:#0B0E13;font-variant-numeric:tabular-nums}
.rbar>span{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap}
.rbar .inf{background:var(--cyan)}.rbar .cav{background:var(--accent)}.rbar .arc{background:var(--profit)}

.lrow.up .lk{color:var(--profit)}.lrow.no .lk{color:var(--warn)}

/* ============ SEGMENTED PICKER ============ */
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.seg button{flex:0 0 auto;background:var(--bg-2);border:1px solid var(--bd);color:var(--fg-mute);

  text-transform:uppercase;cursor:pointer;transition:.12s var(--ease)}

/* ============ DETAILS ============ */
details{border:1px solid var(--bd);background:var(--bg-2);margin:8px 0;padding:0}
details[open]{border-color:var(--bd-strong)}
summary{cursor:pointer;font-weight:700;font-size:13px;padding:11px 13px;list-style:none;display:flex;
  align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-family:var(--font-mono);color:var(--accent);font-weight:700;width:12px}
details[open] summary::before{content:"\2212"}
details>div,details>.dt{padding:0 13px 13px}

.calhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;gap:8px}
.calhead .mon{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--accent);letter-spacing:.04em}
.calnav{background:var(--bg-2);border:1px solid var(--bd-strong);color:var(--fg);padding:6px 13px;cursor:pointer;
  font-family:var(--font-mono);font-size:14px}

.caldow{text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--fg-dim);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding-bottom:3px}
.calcell{min-height:52px;border:1px solid var(--bd);padding:4px 5px;background:var(--bg-2);cursor:pointer;

.calcell:hover{border-color:var(--bd-strong)}
.calcell .dn{font-family:var(--font-mono);font-size:12px;font-weight:700;line-height:1.1}
.calcell .sd{font-family:var(--font-mono);font-size:8px;color:var(--fg-dim);position:absolute;top:4px;right:5px}

/* staggered card entrance on tab switch */
.tab.active>.card,.tab.active>.nowhud{animation:cardin .32s var(--ease) both}
.tab.active>*:nth-child(2){animation-delay:.04s}
.tab.active>*:nth-child(3){animation-delay:.08s}
.tab.active>*:nth-child(4){animation-delay:.12s}
.tab.active>*:nth-child(5){animation-delay:.16s}
.tab.active>*:nth-child(6){animation-delay:.2s}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}}
/* pressed feedback */
.btn:active,.qbtn:active,.navbtn:active,.seg button:active,.subnav button:active,.iconbtn:active{transform:scale(.97)}
/* countdown progress bar */
.cdbar{height:3px;background:rgba(255,255,255,.05);border-radius:2px;margin:-1px 2px 6px;overflow:hidden}
.cdbar .cdfill{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width 1s linear}

::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:4px}

/* respect reduced motion */
@media (prefers-reduced-motion:reduce){

}

ization: kerjakan task harian, penuhi kuota poin pribadi untuk reward aliansi.":"Like Mobilization: do the daily tasks and hit your personal quota for alliance rewards.","Match rebut menara — pasukan PULIH setelah match (tanpa korban permanen). Ikut rombongan besar, jangan solo.":"Tower-capture match — troops RECOVER afterwards (no permanent losses). Stick with the main group, don't solo.","3 aliansi rebut wilayah — ikuti panggilan rally R4/R5. Di luar jam perang: shield.":"3 alliances fight for territory — follow R4/R5 rally calls. Outside war hours: shield up.","Hanya pencocokan lawan KvK — tak ada aksi. Siapkan stok item & rencana shield untuk KvK.":"KvK opponent matchmaking only — nothing to do. Prepare item stockpiles & a shield plan for KvK.","Kerjakan tantangan harian di tab Events — reward tiap tahap gratis. Jangan beli attempt.":"Do the daily challenges in the Events tab — every stage reward is free. Don't buy attempts.","Skor dari Forgehammer/Mithril/shard/Truegold. ⛔ JANGAN buang speedup di sini (1 poin/menit).":"Points from Forgehammer/Mithril/shards/Truegold. ⛔ DON'T dump speedups here (1 point/minute).","Skor dari hero gear (Forgehammer/Mithril). ⛔ JANGAN buang speedup di sini.":"Points from hero gear (Forgehammer/Mithril). ⛔ DON'T dump speedups here.","Task ringan berhadiah (login, stamina, dsb.) — selesaikan yang gratis saja.":"Light reward tasks (login, stamina, etc.) — just finish the free ones.","Task ringan berhadiah — selesaikan yang gratis saja.":"Light reward tasks — just finish the free ones.","Undian — pakai tiket/attempt GRATIS harian saja, jangan beli.":"A lottery — use only the FREE daily tickets/attempts, don't buy.","Bait gratis +1/3 jam (cap 10 — jangan biarkan penuh). Upgrade gear SEGERA: Line → Hook → Sinker (reset tiap musim). Kejar reward level milestone — termasuk Conquest Manual (tabung kalau tak main Arena). Abaikan leaderboard (P2W).":"Free bait +1/3h (caps at 10 — don't let it sit full). Upgrade gear EARLY: Line → Hook → Sinker (resets every season). Chase the milestone reward levels — they include Conquest Manuals (stash them if you don't play Arena). Ignore the leaderboard (P2W).","berkala (muncul ~hari 15)":"recurring (appears ~day 15)","Mancing — Bait mulai 5, +1 tiap 3 jam, cap 10. Low-effort tapi reward bagus: Gem, shard Mythic, Governor Gear, mat charm, dan Conquest Manual di reward level milestone (tabung kalau tak main Arena). F2P: upgrade gear SEGERA urutan Line → Hook → Sinker (reset tiap musim); pakai \"Ocean Prospector Map\" gratis di lemparan PERTAMA (gear auto-max = skor besar). Jangan biarkan Bait mentok 10 (regen terbuang). Token sisa auto-convert ke resource di akhir. Jangan beli pass berbayar.":"Fishing — Bait starts at 5, +1 every 3h, caps at 10. Low effort but great rewards: Gems, Mythic shards, Governor Gear, charm mats, plus Conquest Manuals at milestone reward levels (stash them if you don't play Arena). F2P: upgrade gear EARLY in order Line → Hook → Sinker (resets every season); use the free \"Ocean Prospector Map\" on your FIRST cast (auto-maxed gear = big score). Don't let Bait sit at 10 (regen wasted). Leftover tokens auto-convert to resources at the end. Don't buy the paid pass.","Event tema ringan — ambil reward gratis, skip pembelian.":"Light themed event — grab the free rewards, skip purchases.","Event poin kombat ringan — ikut dari aktivitas normal, jangan spend khusus.":"Light combat-point event — participate via normal play, no dedicated spending.","Progres solo — reward bertahap dari aktivitas normal, tak perlu spend.":"Solo progression — staged rewards from normal play, no spending needed.","Bunuh beast di map — habiskan semua stamina di hari ini (hemat: hero Diana).":"Kill beasts on the map — burn all stamina on this day (saver: hero Diana).","Kosongkan kota, reinforce ally ONLINE. Lineup: tab Hero → Viking Vengeance.":"Empty your city and reinforce ONLINE allies. Lineup: Hero tab → Viking Vengeance.","Event skor 7 hari — ikuti tema harian (lihat Advisory & Ensiklopedia SG).":"7-day score event — follow the daily themes (see Advisory & the SG encyclopedia entry).","Castle Battle: serang TURRET (bukan castle), masuk Forbidden Zone <1 jam sebelum mulai.":"Castle Battle: attack the TURRETS (not the castle), enter the Forbidden Zone <1h before start.","Serang TURRET (bukan castle); TP masuk <1 jam sebelum mulai; batch-heal.":"Attack the TURRETS (not the castle); teleport in <1h before start; batch-heal.","Kill event: SHIELD tiap offline; farm gatherer lawan (injured = killed, tanpa hospital).":"Kill event: SHIELD whenever offline; farm enemy gatherers (injured = killed, no hospital).","War Preparation: stage troop, isi formasi, kosongkan hospital, koordinasi aliansi.":"War Preparation: stage troops, fill formations, empty the hospital, coordinate with the alliance.","Fase pemulihan KvK — heal pasukan (batch + help aliansi), klaim reward.":"KvK recovery phase — heal troops (batch + alliance help), claim rewards.","Cek detail di tab Events in-game. Aturan F2P: pakai attempt/reward gratis, jangan beli pack.":"Check details in the in-game Events tab. F2P rule: use free attempts/rewards, don't buy packs.","⏳ Memuat jadwal live…":"⏳ Loading live schedule…","Gagal memuat jadwal live (offline/proxy diblokir). Coba lagi nanti.":"Failed to load the live schedule (offline/proxy blocked). Try again later.","↻ Coba lagi":"↻ Retry","Event minggu ini":"This week's events","lewat":"past","sekarang":"now","Event PERTUMBUHAN berbasis umur server (HoG · KvK · SG · Burst · Milestone). Event mingguan aliansi ada di kartu \"Jadwal Kingdom (live)\" di atas.":"GROWTH events driven by server age (HoG · KvK · SG · Burst · Milestone). Weekly alliance events live in the \"Kingdom Schedule (live)\" card above.","📷 Jiplak screenshot":"📷 Trace screenshot","🖼 Atur gambar: ON":"🖼 Adjust image: ON","🖼 Atur gambar: OFF":"🖼 Adjust image: OFF","Mode Atur gambar ON: geser = pindahkan gambar, cubit/scroll = besar-kecil. Pas-kan 2-3 patokan pulaumu ke grid, matikan (OFF), lalu jiplak pakai mode 🌵/⬜/✅. Gambar hanya alat bantu — tidak ikut tersimpan.":"Adjust-image mode ON: drag = move the image, pinch/scroll = resize. Align 2-3 landmarks of your island to the grid, switch it OFF, then trace with the 🌵/⬜/✅ modes. The image is just an aid — it is not saved.","Cukup SATU hero — pilih salah satu (taruh di slot-1):":"Just ONE hero — pick one (put it in slot-1):","atau":"or","Strongest Governor. Angka kecil = hari ke-berapa event (HoG":"Strongest Governor. Small number = the event's day (HoG","= hari ke-2).":"= day 2).","⚔ 1 march: max 3 hero, SATU per kelas (Inf/Cav/Arc) — 2 Archer (mis. Yeonwoo+Amane) TIDAK BISA bareng.":"⚔ One march: max 3 heroes, ONE per class (Inf/Cav/Arc) — 2 Archers (e.g. Yeonwoo+Amane) CANNOT be fielded together.","Khusus Arena: 5 hero BEBAS kelas (aturan march tidak berlaku).":"Arena only: 5 heroes, ANY class (the march rule does not apply).","Joiner → cuma hero SLOT-1 yang dihitung (skill Expedition #1).":"Joiner → only the SLOT-1 hero counts (Expedition skill #1).","Pilih SALAH SATU untuk slot-1:":"Pick ONE for slot-1:","Garrison = 1 march: 1 Inf + 1 Cav + 1 Arc. Zoe (Inf, inti — HP tinggi + widget defensif) + Gordon atau Jabel (Cav) + Quinn (Arc). Batch-heal biar pasukan luka, bukan mati.":"A garrison = 1 march: 1 Inf + 1 Cav + 1 Arc. Zoe (Inf, core — high HP + defensive widget) + Gordon or Jabel (Cav) + Quinn (Arc). Batch-heal so troops get injured, not killed.","5 hero BEBAS kelas — khusus Arena (aturan 1-per-kelas hanya berlaku di march). Arena ABAIKAN skill Expedition — yang dipakai = skill CONQUEST (Ultimate otomatis).":"5 heroes, ANY class — Arena only (the 1-per-class rule applies to marches). Arena IGNORES Expedition skills — it uses CONQUEST skills (auto Ultimate).","Mix 102×101 terjadi ANTAR joiner di rally yang sama — bukan satu lineup (Amane & Yeonwoo sama-sama Archer, tak bisa satu march).":"The 102×101 mix happens ACROSS joiners in the same rally — not in one lineup (Amane & Yeonwoo are both Archers, can't share a march).","Tulang punggung rally-stacking. Saat join bawa SATU: Chenko/Yeonwoo (101) atau Amane (102) — efeknya menumpuk antar joiner, bukan dalam satu lineup.":"The backbone of rally-stacking. When joining bring ONE: Chenko/Yeonwoo (101) or Amane (102) — effects stack across joiners, not within one lineup.","(Inf · inti)":"(Inf · core)","Diambil live dari kingshot.net + kingshotwiki.com. Kode baru otomatis di-redeem ke Player ID-mu.":"Pulled live from kingshot.net + kingshotwiki.com. New codes are auto-redeemed to your Player ID.","⚡ Redeem semua (paksa)":"⚡ Redeem all (force)","Hubungkan Player ID (tab Profil) untuk auto-redeem kode baru.":"Connect your Player ID (Profile tab) to auto-redeem new codes.","✔ Semua kode aktif sudah pernah di-redeem.":"✔ All active codes have already been redeemed.","Auto-redeem kode baru":"Auto-redeem of new codes","Hadiah masuk mail in-game.":"Rewards arrive in your in-game mail.","cubit 2 jari / Ctrl+scroll = zoom":"pinch 2 fingers / Ctrl+scroll = zoom","⬜ Jalan":"⬜ Path","Dasar peta = template komunitas:":"Map base = the community template:","abu-abu":"gray","= kaktus belum dibuka ·":"= uncleared cactus ·","putih":"white","= jalur ter-buka ·":"= cleared route ·","merah":"red","= peti (hanya peti yang berlabel koordinat). Samakan dengan pulaumu pakai mode 🌵/⬜, lalu tandai ✅ tiap sel yang sudah kamu buka. Tersimpan otomatis & ikut Export backup.":"= chest (only chests get coordinate labels). Match your island using the 🌵/⬜ modes, then mark ✅ every cell you have cleared. Auto-saved & included in Export backup."};
/* ============================================================
   KINGSHOT13 — i18n runtime (ID ⇄ EN)
   Post-render translation layer. The app renders Indonesian;
   this walks the DOM and swaps to English when LANG==='en'.
   Originals are kept in a WeakMap so switching back to ID is
   lossless. window.__TR (the phrase dictionary) is injected
   immediately before this script at build time.
   ============================================================ */
(function(){
  var TR = window.__TR || {};
  var LANG = 'id';
  try { var sv = localStorage.getItem('ks_lang'); if (sv) LANG = JSON.parse(sv); } catch(e){}
  window.__getLang = function(){ return LANG; };

  /* Dynamic-string rules: applied (in order) only when a text node has
     no exact dictionary match. Handle templated text + date words. */
  var RULES = [
    [/\bHari ke-(\d+)/g, 'Day $1'],
    [/\bServer hari\b/g, 'Server day'],
    [/\bserver hari\b/g, 'server day'],
    [/\(server hari (\d+)\)/g, '(server day $1)'],
    [/Belum aktif/g, 'Not active yet'],
    [/mulai ~hari (\d+)/g, 'starts ~day $1'],
    [/~hari (\d+)/g, '~day $1'],
    [/Simpan persiapan\./g, 'Save your prep.'],
    [/\b1 hari lagi/g, '1 day left'],
    [/(\d+) hari lagi/g, '$1 days left'],
    [/\bhari ini\b/g, 'today'],
    [/sisa (\d+) hari/g, '$1 days left'],
    [/(\d+(?:[.,]\d+)?) hari\/level/g, '$1 days/level'],
    [/~(\d+) hari/g, '~$1 days'],
    [/(\d+) hari\b/g, '$1 days'],
    [/\bTC masih (\d+)/g, 'TC still $1'],
    [/Kebut TC ke (\d+)/g, 'Rush TC to $1'],
    /* event advisory (dynamic, number-interpolated) */
    [/Server masih baru \(hari/g, 'Server is still new (day'],
    [/baru aktif/g, 'becomes active'],
    [/\b(D\d+) AKTIF\b/g, '$1 ACTIVE'],
    [/Jam event:/g, 'Event time:'],
    [/Player ID tidak ditemukan/g, 'Player ID not found'],
    [/server buka/g, 'server opened'],
    [/jam event\b/g, 'event time'],
    [/Age of Truegold lewat tapi/g, 'Age of Truegold passed but'],
    [/\bKamu TC/g, "You're TC"],
    [/Ketat! Jangan biarkan antrian kosong\./g, "Tight! Don't let the queue go empty."],
    [/Jaga ritme upgrade\./g, 'Keep up the upgrade pace.'],
    [/Fokus saat itu \(H/g, 'Focus then (H'],
    [/generasi aktif/g, 'active generation'],
    [/siapkan untuk tanggal ini/g, 'prep for this date'],
    [/\baktif\b/g, 'active'],
    [/Menuju Age of Truegold/g, 'Toward Age of Truegold'],
    [/\bsisa\b/g, 'left'],
    [/\btercapai\b/g, 'reached'],
    [/\bhari\b/g, 'days'],
    [/\bs\/d\b/g, 'until'],
    /* day abbreviations (calendar + schedule) */
    [/\bMin\b/g,'Sun'],[/\bSen\b/g,'Mon'],[/\bSel\b/g,'Tue'],[/\bRab\b/g,'Wed'],
    [/\bKam\b/g,'Thu'],[/\bJum\b/g,'Fri'],[/\bSab\b/g,'Sat'],
    /* month abbreviations that differ from English */
    [/\bMei\b/g,'May'],[/\bAgu\b/g,'Aug'],[/\bOkt\b/g,'Oct'],[/\bDes\b/g,'Dec'],
    /* full day names */
    [/\bMinggu\b/g,'Sunday'],[/\bSenin\b/g,'Monday'],[/\bSelasa\b/g,'Tuesday'],
    [/\bRabu\b/g,'Wednesday'],[/\bKamis\b/g,'Thursday'],[/\bJumat\b/g,'Friday'],[/\bSabtu\b/g,'Saturday'],
    /* full month names that differ */
    [/\bJanuari\b/g,'January'],[/\bFebruari\b/g,'February'],[/\bMaret\b/g,'March'],
    [/\bJuni\b/g,'June'],[/\bJuli\b/g,'July'],[/\bAgustus\b/g,'August'],
    [/\bOktober\b/g,'October'],[/\bDesember\b/g,'December']
  ];

  function applyEN(src){
    var key = src.trim();
    if (key && TR[key] !== undefined){
      return src.replace(key, TR[key]);
    }
    var out = src, changed = false;
    for (var i=0;i<RULES.length;i++){
      var n = out.replace(RULES[i][0], RULES[i][1]);
      if (n !== out){ out = n; changed = true; }
    }
    return changed ? out : src;
  }

  var orig = new WeakMap();   /* textNode -> Indonesian original */

  function setNode(node){
    var cur = node.nodeValue;
    if (!cur || !/\S/.test(cur)) return;
    if (orig.has(node)){
      /* if the app wrote NEW text into a node we translated earlier, adopt the
         new value as the original instead of resurrecting the old one */
      var o = orig.get(node);
      if (cur !== o && cur !== applyEN(o)) orig.delete(node);
    }
    var src = orig.has(node) ? orig.get(node) : cur;
    var target = (LANG === 'en') ? applyEN(src) : src;
    if (!orig.has(node) && target !== src) orig.set(node, src);
    if (node.nodeValue !== target) node.nodeValue = target;
  }

  var attrOrig = new WeakMap(); /* element -> {attr: idValue} */
  function setAttr(el, attr){
    var cur = el.getAttribute(attr);
    if (cur == null || !/\S/.test(cur)) return;
    var store = attrOrig.get(el) || {};
    var src = (store[attr] !== undefined) ? store[attr] : cur;
    var dictKey = '@'+(attr==='placeholder'?'ph':attr)+':'+src.trim();
    var target = src;
    if (LANG === 'en' && TR[dictKey] !== undefined){
      target = TR[dictKey].replace(/^@(?:ph|title):/, ''); /* values may keep the lookup prefix */
    }
    if (store[attr] === undefined && target !== src){ store[attr] = src; attrOrig.set(el, store); }
    if (cur !== target) el.setAttribute(attr, target);
  }

  function skip(node){
    var p = node.parentNode;
    if (!p) return true;
    var t = p.nodeName;
    return t === 'SCRIPT' || t === 'STYLE' || p.id === 'langtoggle';
  }

  function translateTree(root){
    if (!root) return;
    if (root.nodeType === 3){ if(!skip(root)) setNode(root); return; }
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var n, batch = [];
    while ((n = walker.nextNode())) batch.push(n);
    for (var i=0;i<batch.length;i++){ if(!skip(batch[i])) setNode(batch[i]); }
    if (root.querySelectorAll){
      root.querySelectorAll('[placeholder]').forEach(function(el){ setAttr(el,'placeholder'); });
      root.querySelectorAll('[title]').forEach(function(el){ setAttr(el,'title'); });
    }
  }

  /* Observe the whole app: every re-render adds nodes -> translate them.
     Our nodeValue edits don't add/remove nodes, so no feedback loop. */
  var observer = new MutationObserver(function(muts){
    for (var i=0;i<muts.length;i++){
      var m = muts[i];
      if (m.type === 'characterData' && m.target && !skip(m.target)){
        if (LANG === 'en') setNode(m.target);
        else if (orig.has(m.target) && m.target.nodeValue !== orig.get(m.target)){
          orig.delete(m.target); /* app wrote new ID text in-place — drop the stale original */
        }
        continue;
      }
      if (LANG !== 'en') continue;   /* additions need no work in Indonesian mode */
      for (var j=0;j<m.addedNodes.length;j++){
        var nd = m.addedNodes[j];
        if (nd.nodeType === 3){ if(!skip(nd)) setNode(nd); }
        else if (nd.nodeType === 1) translateTree(nd);
      }
    }
  });

  function start(){
    try { observer.observe(document.documentElement, {childList:true, subtree:true, characterData:true}); } catch(e){}
    translateTree(document.body || document.documentElement);
  }

  /* Toggle entry point used by the header button (event-delegated below). */
  window.setLang = function(l){
    LANG = l;
    try { localStorage.setItem('ks_lang', JSON.stringify(l)); } catch(e){}
    var btn = document.getElementById('langtoggle');
    if (btn) btn.textContent = (l === 'en') ? 'ID' : 'EN';
    /* regenerate dynamic UI (fresh Indonesian), then re-apply language */
    try { if (typeof buildNav === 'function') buildNav(); } catch(e){}
    try { if (typeof renderTopClock === 'function') renderTopClock(); } catch(e){}
    try {
      if (typeof activate === 'function'){
        var last = (window.store && store.get) ? store.get('lastTab','sekarang') : 'sekarang';
        activate(last);
      }
    } catch(e){}
    translateTree(document.body);
  };

  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest ? e.target.closest('#langtoggle') : null;
    if (t){ e.preventDefault(); window.setLang(LANG === 'en' ? 'id' : 'en'); }
  }, true);

  /* set initial button label once DOM is live */
  function syncBtn(){ var b=document.getElementById('langtoggle'); if(b) b.textContent = (LANG==='en')?'ID':'EN'; }

  /* Wrap the app's render entry points so a tab switch / clock tick translates
     synchronously (no flash of Indonesian). The app modules load AFTER this
     inline script, so we wrap on the next macrotask once they're defined.
     A global function declaration is a property of window, so reassigning it
     redirects later identifier lookups inside the modules too. */
  function wrap(name){
    var orig = window[name];
    if (typeof orig !== 'function' || orig.__i18nWrapped) return;
    var w = function(){ var r = orig.apply(this, arguments); if (LANG === 'en') translateTree(document.body); return r; };
    w.__i18nWrapped = true;
    try { window[name] = w; } catch(e){}
  }
  window.__translate = function(){ translateTree(document.body); };

  start();
  syncBtn();
  /* NOTE: renderTopClock is intentionally NOT wrapped — it runs every second
     via tickClock, and a full-body translateTree per tick is a serious perf
     drain on phones. The MutationObserver picks up its innerHTML writes.
     The app modules load AFTER this inline script (the loader executes them
     one by one), so poll until the functions actually exist before wrapping. */
  var _wrapTries = 0;
  var _wrapTimer = setInterval(function(){
    ['activate','buildNav'].forEach(wrap);
    syncBtn();
    var done = window.activate && window.activate.__i18nWrapped;
    if (done && LANG === 'en') translateTree(document.body);
    if (done || ++_wrapTries > 50) clearInterval(_wrapTimer);
  }, 150);
})();
